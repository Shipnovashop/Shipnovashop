<!doctype html><html><head><meta charset="utf-8"><title>Products</title><link rel="stylesheet" href="style.css"></head><body><nav><b>ShipNova</b><a href="index.html">Home</a></nav><main class="container"><h1>Products</h1><input id="q" placeholder="Search products..."><div id="list" class="grid"></div></main><script src="api-config.js"></script><script src="app.js"></script><script>async function load(){const d=await api('/api/products?q='+encodeURIComponent(q.value));list.innerHTML=d.products.map(p=>`<div class="card product">${p.image?`<img src="${p.image}">`:''}<h3>${p.name}</h3><p>${p.description||''}</p><b>₹${Number(p.price).toFixed(2)}</b><p class="muted">Seller: ${p.seller_name}</p><p>Stock: ${p.stock}</p></div>`).join('')||'<p>No products found.</p>'}q.oninput=load;load()</script></body></html>
