<!doctype html>

<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Seller Login - ShipNovaShop</title>
  <style>
    * { box-sizing: border-box; }body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #2563eb, #172554);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.card {
  width: 100%;
  max-width: 420px;
  background: white;
  border-radius: 18px;
  padding: 30px;
  box-shadow: 0 20px 50px rgba(0,0,0,.25);
}

.logo {
  text-align: center;
  font-size: 30px;
  font-weight: 800;
  color: #1d4ed8;
}

.subtitle {
  text-align: center;
  color: #6b7280;
  margin: 7px 0 24px;
}

h2 {
  text-align: center;
  color: #111827;
  margin-bottom: 22px;
}

label {
  display: block;
  font-weight: 600;
  margin: 14px 0 7px;
  color: #374151;
}

input {
  width: 100%;
  padding: 13px;
  border: 1px solid #d1d5db;
  border-radius: 10px;
  font-size: 16px;
  outline: none;
}

input:focus {
  border-color: #2563eb;
}

button {
  width: 100%;
  margin-top: 22px;
  padding: 14px;
  border: 0;
  border-radius: 10px;
  background: #2563eb;
  color: white;
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
}

button:disabled {
  opacity: .6;
  cursor: not-allowed;
}

.message {
  display: none;
  margin-top: 16px;
  padding: 12px;
  border-radius: 9px;
  text-align: center;
  font-size: 14px;
}

.error {
  display: block;
  background: #fee2e2;
  color: #991b1b;
}

.success {
  display: block;
  background: #dcfce7;
  color: #166534;
}

.links {
  text-align: center;
  margin-top: 20px;
  line-height: 1.9;
}

a {
  color: #2563eb;
  text-decoration: none;
}

  </style>
</head><body>
  <div class="card">
    <div class="logo">🚚 ShipNovaShop</div>
    <div class="subtitle">Seller Center</div><h2>Seller Login</h2>

<form id="loginForm">

  <label for="email">Seller Email</label>
  <input
    id="email"
    type="email"
    required
    placeholder="seller@example.com"
    autocomplete="username"
  >

  <label for="password">Password</label>
  <input
    id="password"
    type="password"
    required
    placeholder="Enter your password"
    autocomplete="current-password"
  >

  <button id="loginBtn" type="submit">
    Login as Seller
  </button>
</form>

<div id="message" class="message"></div>

<div class="links">
  New seller?
  <a href="seller-register.html">Create Seller Account</a>
  <br>
  <a href="index.html">← Back to ShipNovaShop</a>
</div>

  </div><script>
const API = "https://shipnovashop.onrender.com";

const form = document.getElementById("loginForm");
const button = document.getElementById("loginBtn");
const message = document.getElementById("message");

function showMessage(text, type) {
  message.textContent = text;
  message.className = "message " + type;
}

form.addEventListener("submit", async function(e) {
  e.preventDefault();

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  button.disabled = true;
  button.textContent = "Logging in...";
  message.className = "message";

  try {
    const response = await fetch(API + "/api/auth/login", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        email,
        password
      })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || data.message || "Login failed");
    }

    if (!data.user || data.user.role !== "seller") {
      throw new Error("This account is not a seller account.");
    }

    if (!data.token) {
      throw new Error("Login succeeded but no authentication token was returned.");
    }

    localStorage.setItem("shipnova_token", data.token);
    localStorage.setItem("shipnova_user", JSON.stringify(data.user));

    showMessage(
      "Seller login successful. Opening dashboard...",
      "success"
    );

    setTimeout(() => {
      window.location.href = "seller.html";
    }, 700);

  } catch (error) {
    console.error(error);
    showMessage(error.message || "Unable to connect to server.", "error");
  } finally {
    button.disabled = false;
    button.textContent = "Login as Seller";
  }
});
</script></body>
</html>
