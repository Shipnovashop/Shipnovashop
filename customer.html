<!doctype html><html><head><meta charset="utf-8"><title>Customer</title><link rel="stylesheet" href="style.css"></head><body><nav><b>Customer Dashboard</b><span><a href="product.html">Products</a><button onclick="logout()">Logout</button></span></nav><main class="container"><div class="card"><h2>Welcome</h2><p>Browse products from ShipNova sellers.</p></div><div id="list" class="grid"></div></main><script src="api-config.js"></script><script src="app.js"></script><script>api('/api/products').then(d=>list.innerHTML=d.products.map(p=>`<div class="card"><h3>${p.name}</h3><p>${p.description}</p><b>₹${p.price}</b><p>Stock: ${p.stock}</p></div>`).join(''))</script></body></html>
