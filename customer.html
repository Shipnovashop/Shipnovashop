<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>ShipNovaShop - Customer</title>

  <link rel="stylesheet" href="style.css">

  <style>
    .customer-page {
      max-width: 1200px;
      margin: auto;
      padding: 20px;
    }

    .customer-header {
      margin-bottom: 20px;
    }

    .customer-header h1 {
      margin-bottom: 5px;
    }

    .search-box {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 8px;
      margin: 15px 0;
      font-size: 16px;
      box-sizing: border-box;
    }

    .products-grid {
      display: grid;
      grid-template-columns:
        repeat(auto-fit, minmax(230px, 1fr));
      gap: 18px;
    }

    .product-card {
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 12px;
      overflow: hidden;
      padding: 14px;
      box-shadow: 0 2px 8px rgba(0,0,0,.06);
    }

    .product-image {
      width: 100%;
      height: 200px;
      object-fit: contain;
      background: #f5f5f5;
      border-radius: 8px;
      margin-bottom: 12px;
    }

    .product-card h3 {
      margin: 5px 0 10px;
    }

    .product-card p {
      margin: 5px 0;
    }

    .category-badge {
      display: inline-block;
      padding: 5px 9px;
      background: #eef3ff;
      border-radius: 20px;
      font-size: 13px;
      margin-bottom: 8px;
    }

    .price {
      font-size: 20px;
      font-weight: bold;
      margin: 8px 0;
    }

    .stock {
      font-size: 14px;
    }

    .btn {
      border: 0;
      border-radius: 7px;
      padding: 10px 14px;
      cursor: pointer;
    }

    .btn-primary {
      background: #111827;
      color: white;
    }

    .btn-danger {
      background: #dc2626;
      color: white;
    }

    .btn-secondary {
      background: #e5e7eb;
      color: #111;
    }

    .cart-box,
    .orders-box,
    .delivery-box {
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 18px;
      margin-top: 25px;
    }

    .cart-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 12px 0;
      border-bottom: 1px solid #eee;
    }

    .cart-controls {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .qty-btn {
      width: 32px;
      height: 32px;
      border: 1px solid #ccc;
      background: #fff;
      border-radius: 6px;
      cursor: pointer;
    }

    .form-group {
      margin-bottom: 14px;
    }

    .form-group label {
      display: block;
      margin-bottom: 5px;
      font-weight: 600;
    }

    .form-group input,
    .form-group textarea {
      width: 100%;
      padding: 11px;
      border: 1px solid #ccc;
      border-radius: 7px;
      box-sizing: border-box;
    }

    .form-group textarea {
      min-height: 90px;
      resize: vertical;
    }

    .order-card {
      border: 1px solid #ddd;
      border-radius: 9px;
      padding: 14px;
      margin-bottom: 12px;
    }

    .empty {
      text-align: center;
      padding: 25px;
      color: #666;
    }

    .nav-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    @media (max-width: 600px) {
      .customer-page {
        padding: 12px;
      }

      .cart-item {
        flex-direction: column;
        align-items: flex-start;
      }

      .product-image {
        height: 180px;
      }
    }
  </style>
</head>

<body>

  <nav class="navbar">
    <div class="nav-container">

      <a href="index.html">
        ShipNovaShop
      </a>

      <div class="nav-actions">
        <a href="index.html">Home</a>
        <a href="customer.html">Products</a>
        <button
          class="btn btn-danger"
          onclick="logoutUser()"
        >
          Logout
        </button>
      </div>

    </div>
  </nav>


  <main class="customer-page">

    <section class="customer-header">

      <h1>Customer Marketplace</h1>

      <p id="welcomeText">
        Welcome to ShipNovaShop
      </p>

      <input
        id="searchInput"
        class="search-box"
        type="search"
        placeholder="Search products, seller or category..."
        oninput="filterProducts()"
      >

    </section>


    <!-- PRODUCTS -->

    <section>

      <h2>Products</h2>

      <div
        id="productsGrid"
        class="products-grid"
      >
        <div class="empty">
          Loading products...
        </div>
      </div>

    </section>


    <!-- CART -->

    <section class="cart-box">

      <h2>🛒 My Cart</h2>

      <div id="cartItems">
        <div class="empty">
          Your cart is empty.
        </div>
      </div>

      <h3>
        Total:
        ₹<span id="cartTotal">0.00</span>
      </h3>

    </section>


    <!-- DELIVERY -->

    <section class="delivery-box">

      <h2>Delivery Details</h2>

      <div class="form-group">

        <label for="deliveryName">
          Full Name
        </label>

        <input
          id="deliveryName"
          type="text"
          placeholder="Enter your full name"
        >

      </div>


      <div class="form-group">

        <label for="deliveryMobile">
          Mobile Number
        </label>

        <input
          id="deliveryMobile"
          type="tel"
          maxlength="10"
          placeholder="10 digit mobile number"
        >

      </div>


      <div class="form-group">

        <label for="deliveryAddress">
          Delivery Address
        </label>

        <textarea
          id="deliveryAddress"
          placeholder="Enter complete delivery address"
        ></textarea>

      </div>


      <button
        class="btn btn-primary"
        onclick="placeOrder()"
      >
        Place Order
      </button>

    </section>


    <!-- ORDERS -->

    <section class="orders-box">

      <h2>📦 My Orders</h2>

      <div id="ordersList">
        <div class="empty">
          Loading orders...
        </div>
      </div>

    </section>

  </main>


  <script src="api-config.js"></script>
  <script src="app.js"></script>

  <script>

    let products = [];
    let cart = [];

    const API =
      window.SHIPNOVA_API ||
      localStorage.getItem("SHIPNOVA_API") ||
      "/api";


    /* =========================
       ESCAPE HELPERS
    ========================= */

    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }


    function escapeJs(value) {
      return String(value ?? "")
        .replace(/\\/g, "\\\\")
        .replace(/'/g, "\\'");
    }


    function formatDate(value) {
      if (!value) return "";

      try {
        return new Date(value).toLocaleString(
          "en-IN"
        );
      } catch {
        return value;
      }
    }


    /* =========================
       USER
    ========================= */

    function currentUser() {
      try {
        return user();
      } catch {
        try {
          return JSON.parse(
            localStorage.getItem("shipnova_user") || "null"
          );
        } catch {
          return null;
        }
      }
    }


    function logoutUser() {

      localStorage.removeItem("shipnova_token");
      localStorage.removeItem("shipnova_user");

      window.location.href = "login.html";
    }


    /* =========================
       LOGIN CHECK
    ========================= */

    function checkCustomerLogin() {

      const u = currentUser();

      if (!u) {
        window.location.href = "login.html";
        return false;
      }

      if (
        u.role &&
        u.role !== "customer"
      ) {
        alert(
          "Please login with a customer account."
        );

        window.location.href = "login.html";

        return false;
      }

      document.getElementById(
        "welcomeText"
      ).textContent =
        `Welcome, ${u.name || "Customer"}!`;

      return true;
    }


    /* =========================
       API
    ========================= */

    async function apiFetch(
      path,
      options = {}
    ) {

      const token =
        localStorage.getItem(
          "shipnova_token"
        );

      const headers = {
        "Content-Type": "application/json",
        ...(options.headers || {})
      };

      if (token) {
        headers.Authorization =
          `Bearer ${token}`;
      }

      const response =
        await fetch(
          `${API}${path}`,
          {
            ...options,
            headers
          }
        );

      let data = {};

      try {
        data = await response.json();
      } catch {}

      if (!response.ok) {

        throw new Error(
          data.error ||
          "Request failed"
        );
      }

      return data;
    }


    /* =========================
       LOAD PRODUCTS
    ========================= */

    async function loadProducts() {

      const grid =
        document.getElementById(
          "productsGrid"
        );

      try {

        const data =
          await apiFetch(
            "/api/products"
          );

        products =
          Array.isArray(data.products)
            ? data.products
            : [];

        renderProducts(products);

      } catch (error) {

        console.error(error);

        grid.innerHTML = `
          <div class="empty">
            Unable to load products.
            <br>
            ${escapeHtml(error.message)}
          </div>
        `;
      }
    }


    /* =========================
       RENDER PRODUCTS
    ========================= */

    function renderProducts(list) {

      const grid =
        document.getElementById(
          "productsGrid"
        );

      if (!list.length) {

        grid.innerHTML = `
          <div class="empty">
            No products found.
          </div>
        `;

        return;
      }


      grid.innerHTML =
        list.map(p => {

          const image =
            p.image ||
            "https://via.placeholder.com/500x400?text=ShipNovaShop";

          const category =
            p.category || "Other";

          const seller =
            p.seller_business_name ||
            p.seller_name ||
            "ShipNova Seller";

          const stock =
            Number(p.stock || 0);


          return `
            <article class="product-card">

              <img
                class="product-image"
                src="${escapeHtml(image)}"
                alt="${escapeHtml(p.name)}"
                onerror="
                  this.src='https://via.placeholder.com/500x400?text=No+Image'
                "
              >

              <span class="category-badge">
                ${escapeHtml(category)}
              </span>

              <h3>
                ${escapeHtml(p.name)}
              </h3>

              <p>
                ${escapeHtml(
                  p.description || "No description"
                )}
              </p>

              <p>
                <b>Category:</b>
                ${escapeHtml(category)}
              </p>

              <p>
                <b>Seller:</b>
                ${escapeHtml(seller)}
              </p>

              <div class="price">
                ₹${Number(p.price || 0).toFixed(2)}
              </div>

              <p class="stock">
                <b>Stock:</b>
                ${stock}
              </p>

              <button
                class="btn btn-primary"
                onclick="addToCart(${Number(p.id)})"
                ${stock <= 0 ? "disabled" : ""}
              >
                ${
                  stock <= 0
                    ? "Out of Stock"
                    : "Add to Cart"
                }
              </button>

            </article>
          `;

        }).join("");
    }


    /* =========================
       SEARCH
    ========================= */

    function filterProducts() {

      const keyword =
        document.getElementById(
          "searchInput"
        ).value
        .trim()
        .toLowerCase();


      if (!keyword) {

        renderProducts(products);

        return;
      }


      const filtered =
        products.filter(p => {

          const name =
            String(
              p.name || ""
            ).toLowerCase();

          const description =
            String(
              p.description || ""
            ).toLowerCase();

          const seller =
            String(
              p.seller_name || ""
            ).toLowerCase();

          const business =
            String(
              p.seller_business_name || ""
            ).toLowerCase();

          const category =
            String(
              p.category || ""
            ).toLowerCase();


          return (
            name.includes(keyword) ||
            description.includes(keyword) ||
            seller.includes(keyword) ||
            business.includes(keyword) ||
            category.includes(keyword)
          );
        });


      renderProducts(filtered);
    }


    /* =========================
       CART
    ========================= */

    function saveCart() {

      localStorage.setItem(
        "shipnova_cart",
        JSON.stringify(cart)
      );
    }


    function loadCart() {

      try {

        cart =
          JSON.parse(
            localStorage.getItem(
              "shipnova_cart"
            ) || "[]"
          );

        if (!Array.isArray(cart)) {
          cart = [];
        }

      } catch {

        cart = [];
      }

      renderCart();
    }


    function addToCart(productId) {

      const product =
        products.find(
          p => Number(p.id) === Number(productId)
        );

      if (!product) {
        alert("Product not found.");
        return;
      }


      const existing =
        cart.find(
          item =>
            Number(item.product_id) ===
            Number(productId)
        );


      if (existing) {

        if (
          existing.quantity >=
          Number(product.stock)
        ) {
          alert("Maximum available stock reached.");
          return;
        }

        existing.quantity++;

      } else {

        cart.push({
          product_id: Number(product.id),
          name: product.name,
          price: Number(product.price),
          image: product.image || "",
          category: product.category || "Other",
          quantity: 1,
          stock: Number(product.stock)
        });

      }


      saveCart();
      renderCart();
    }


    function changeQty(
      productId,
      amount
    ) {

      const item =
        cart.find(
          x =>
            Number(x.product_id) ===
            Number(productId)
        );

      if (!item) return;


      const product =
        products.find(
          p =>
            Number(p.id) ===
            Number(productId)
        );


      const stock =
        product
          ? Number(product.stock)
          : Number(item.stock || 999999);


      item.quantity += amount;


      if (item.quantity <= 0) {

        cart =
          cart.filter(
            x =>
              Number(x.product_id) !==
              Number(productId)
          );

      } else if (
        item.quantity > stock
      ) {

        item.quantity = stock;

        alert(
          "You cannot order more than available stock."
        );
      }


      saveCart();
      renderCart();
    }


    function removeFromCart(productId) {

      cart =
        cart.filter(
          x =>
            Number(x.product_id) !==
            Number(productId)
        );

      saveCart();
      renderCart();
    }


    function renderCart() {

      const box =
        document.getElementById(
          "cartItems"
        );

      const totalEl =
        document.getElementById(
          "cartTotal"
        );


      if (!cart.length) {

        box.innerHTML = `
          <div class="empty">
            Your cart is empty.
          </div>
        `;

        totalEl.textContent =
          "0.00";

        return;
      }


      let total = 0;


      box.innerHTML =
        cart.map(item => {

          const price =
            Number(item.price || 0);

          const subtotal =
            price *
            Number(item.quantity || 0);

          total += subtotal;


          return `
            <div class="cart-item">

              <div>

                <strong>
                  ${escapeHtml(item.name)}
                </strong>

                <br>

                <small>
                  Category:
                  ${escapeHtml(
                    item.category || "Other"
                  )}
                </small>

                <br>

                ₹${price.toFixed(2)}
                ×
                ${item.quantity}

                =
                ₹${subtotal.toFixed(2)}

              </div>


              <div class="cart-controls">

                <button
                  class="qty-btn"
                  onclick="
                    changeQty(
                      ${Number(item.product_id)},
                      -1
                    )
                  "
                >
                  −
                </button>

                <span>
                  ${item.quantity}
                </span>

                <button
                  class="qty-btn"
                  onclick="
                    changeQty(
                      ${Number(item.product_id)},
                      1
                    )
                  "
                >
                  +
                </button>

                <button
                  class="btn btn-danger"
                  onclick="
                    removeFromCart(
                      ${Number(item.product_id)}
                    )
                  "
                >
                  Remove
                </button>

              </div>

            </div>
          `;

        }).join("");


      totalEl.textContent =
        total.toFixed(2);
    }


    /* =========================
       PLACE ORDER
    ========================= */

    async function placeOrder() {

      if (!cart.length) {
        alert("Your cart is empty.");
        return;
      }


      const name =
        document.getElementById(
          "deliveryName"
        ).value.trim();

      const mobile =
        document.getElementById(
          "deliveryMobile"
        ).value.trim();

      const address =
        document.getElementById(
          "deliveryAddress"
        ).value.trim();


      if (!name) {
        alert("Please enter your full name.");
        return;
      }


      if (!/^[6-9][0-9]{9}$/.test(mobile)) {

        alert(
          "Please enter a valid 10 digit mobile number."
        );

        return;
      }


      if (!address) {

        alert(
          "Please enter your delivery address."
        );

        return;
      }


      const orderItems =
        cart.map(item => ({
          product_id:
            Number(item.product_id),

          quantity:
            Number(item.quantity)
        }));


      try {

        const data =
          await apiFetch(
            "/api/orders",
            {
              method: "POST",

              body: JSON.stringify({
                items: orderItems,

                delivery: {
                  name,
                  mobile,
                  address
                }
              })
            }
          );


        alert(
          `Order placed successfully! Order #${
            data.order?.id || ""
          }`
        );


        cart = [];

        saveCart();

        renderCart();

        document.getElementById(
          "deliveryName"
        ).value = "";

        document.getElementById(
          "deliveryMobile"
        ).value = "";

        document.getElementById(
          "deliveryAddress"
        ).value = "";


        await loadProducts();
        await loadOrders();

      } catch (error) {

        console.error(error);

        alert(
          error.message ||
          "Unable to place order."
        );
      }
    }


    /* =========================
       LOAD ORDERS
    ========================= */

    async function loadOrders() {

      const box =
        document.getElementById(
          "ordersList"
        );


      try {

        const data =
          await apiFetch(
            "/api/orders"
          );

        const orders =
          Array.isArray(data.orders)
            ? data.orders
            : [];


        if (!orders.length) {

          box.innerHTML = `
            <div class="empty">
              You have no orders yet.
            </div>
          `;

          return;
        }


        box.innerHTML =
          orders.map(order => {

            const items =
              Array.isArray(order.items)
                ? order.items
                : [];


            return `
              <div class="order-card">

                <h3>
                  Order #${order.id}
                </h3>

                <p>
                  <b>Date:</b>
                  ${formatDate(order.created_at)}
                </p>

                <p>
                  <b>Status:</b>
                  ${escapeHtml(order.status)}
                </p>

                <p>
                  <b>Total:</b>
                  ₹${Number(
                    order.total || 0
                  ).toFixed(2)}
                </p>

                ${
                  items.length
                    ? `
                      <div>
                        <b>Items:</b>

                        <ul>
                          ${
                            items.map(item => `
                              <li>
                                ${escapeHtml(
                                  item.product_name
                                )}
                                ×
                                ${item.quantity}
                                —
                                ₹${Number(
                                  item.subtotal || 0
                                ).toFixed(2)}
                              </li>
                            `).join("")
                          }
                        </ul>

                      </div>
                    `
                    : ""
                }

              </div>
            `;

          }).join("");


      } catch (error) {

        console.error(error);

        box.innerHTML = `
          <div class="empty">
            Unable to load orders.
          </div>
        `;
      }
    }


    /* =========================
       INIT
    ========================= */

    document.addEventListener(
      "DOMContentLoaded",
      async () => {

        if (!checkCustomerLogin()) {
          return;
        }

        loadCart();

        await loadProducts();

        await loadOrders();

      }
    );

  </script>

</body>
</html>
