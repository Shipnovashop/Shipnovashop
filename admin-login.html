<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Login - ShipNovaShop</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #111827, #374151);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: #fff;
      border-radius: 18px;
      padding: 30px;
      box-shadow: 0 20px 50px rgba(0,0,0,.25);
    }

    .logo {
      text-align: center;
      font-size: 30px;
      font-weight: 800;
      color: #111827;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #6b7280;
      margin-bottom: 25px;
    }

    h2 {
      text-align: center;
      margin: 0 0 22px;
      color: #111827;
    }

    label {
      display: block;
      font-weight: 600;
      margin: 14px 0 7px;
      color: #374151;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #111827;
    }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 14px;
      border: 0;
      border-radius: 10px;
      background: #111827;
      color: white;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .message {
      display: none;
      margin-top: 16px;
      padding: 12px;
      border-radius: 9px;
      text-align: center;
      font-size: 14px;
    }

    .error {
      display: block;
      background: #fee2e2;
      color: #991b1b;
    }

    .success {
      display: block;
      background: #dcfce7;
      color: #166534;
    }

    .links {
      text-align: center;
      margin-top: 20px;
    }

    .links a {
      color: #2563eb;
      text-decoration: none;
    }
  </style>
</head>

<body>

  <div class="card">

    <div class="logo">🚚 ShipNovaShop</div>

    <div class="subtitle">
      Marketplace Administration
    </div>

    <h2>Admin Login</h2>

    <form id="loginForm">

      <label for="email">Admin Email</label>

      <input
        id="email"
        type="email"
        required
        autocomplete="username"
        placeholder="Enter admin email"
      >

      <label for="password">Admin Password</label>

      <input
        id="password"
        type="password"
        required
        autocomplete="current-password"
        placeholder="Enter admin password"
      >

      <button id="loginBtn" type="submit">
        Login as Admin
      </button>

    </form>

    <div id="message" class="message"></div>

    <div class="links">
      <a href="index.html">
        ← Back to ShipNovaShop
      </a>
    </div>

  </div>

  <script>

    const API = "https://shipnovashop.onrender.com";

    const form = document.getElementById("loginForm");
    const button = document.getElementById("loginBtn");
    const message = document.getElementById("message");

    function showMessage(text, type) {
      message.textContent = text;
      message.className = "message " + type;
    }

    form.addEventListener("submit", async function(e) {

      e.preventDefault();

      const email =
        document.getElementById("email").value.trim();

      const password =
        document.getElementById("password").value;

      button.disabled = true;
      button.textContent = "Logging in...";
      message.className = "message";

      try {

        const response = await fetch(
          API + "/api/auth/login",
          {
            method: "POST",

            headers: {
              "Content-Type": "application/json"
            },

            body: JSON.stringify({
              email,
              password
            })
          }
        );

        const data = await response.json();

        if (!response.ok) {
          throw new Error(
            data.error ||
            data.message ||
            "Login failed"
          );
        }

        if (!data.user || data.user.role !== "admin") {
          throw new Error(
            "This account is not an admin account."
          );
        }

        if (!data.token) {
          throw new Error(
            "Login succeeded but no authentication token was returned."
          );
        }

        localStorage.setItem(
          "shipnova_token",
          data.token
        );

        localStorage.setItem(
          "shipnova_user",
          JSON.stringify(data.user)
        );

        showMessage(
          "Admin login successful. Opening dashboard...",
          "success"
        );

        setTimeout(() => {
          window.location.href = "admin.html";
        }, 700);

      } catch (error) {

        console.error(error);

        showMessage(
          error.message ||
          "Unable to connect to server.",
          "error"
        );

      } finally {

        button.disabled = false;
        button.textContent = "Login as Admin";

      }

    });

  </script>

</body>
</html>
