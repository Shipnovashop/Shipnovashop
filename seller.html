<!doctype html>
<html lang="en">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1">

<title>Seller - ShipNovaShop</title>

<link
  rel="stylesheet"
  href="style.css">

<style>

.auth-grid{
  display:grid;
  grid-template-columns:
    repeat(2,1fr);
  gap:20px;
}

.message{
  margin-top:12px;
  padding:10px;
  border-radius:7px;
}

.error{
  background:#fee2e2;
  color:#991b1b;
}

.success{
  background:#dcfce7;
  color:#166534;
}

@media(max-width:700px){

  .auth-grid{
    grid-template-columns:1fr;
  }

}

</style>

</head>


<body>


<nav>

  <b>ShipNova Seller</b>

  <span>

    <a href="index.html">
      Home
    </a>

    <a href="product.html">
      Store
    </a>

    <button
      type="button"
      onclick="logout()">
      Logout
    </button>

  </span>

</nav>


<main class="container">


<!-- =================================
     SELLER AUTH
================================= -->

<section id="authSection">

  <div class="auth-grid">


    <!-- SELLER LOGIN -->

    <div class="card">

      <h2>Seller Login</h2>

      <form id="loginForm">

        <input
          id="loginEmail"
          type="email"
          placeholder="Email"
          autocomplete="username"
          required>


        <input
          id="loginPassword"
          type="password"
          placeholder="Password"
          autocomplete="current-password"
          required>


        <button
          id="loginButton"
          type="submit">

          Seller Login

        </button>

      </form>


      <p
        id="loginMessage"
        class="message"
        style="display:none">
      </p>

    </div>


    <!-- SELLER REGISTRATION -->

    <div class="card">

      <h2>Seller Registration</h2>

      <form id="registerForm">

        <input
          id="registerName"
          type="text"
          placeholder="Full Name"
          required>


        <input
          id="registerEmail"
          type="email"
          placeholder="Email"
          autocomplete="email"
          required>


        <input
          id="registerPassword"
          type="password"
          placeholder="Password"
          minlength="6"
          autocomplete="new-password"
          required>


        <input
          id="registerConfirm"
          type="password"
          placeholder="Confirm Password"
          minlength="6"
          autocomplete="new-password"
          required>


        <button
          id="registerButton"
          type="submit">

          Register as Seller

        </button>

      </form>


      <p
        id="registerMessage"
        class="message"
        style="display:none">
      </p>

    </div>

  </div>

</section>


<!-- =================================
     SELLER DASHBOARD
================================= -->

<section
  id="dashboardSection"
  style="display:none">


  <div class="card">

    <h1>Seller Dashboard</h1>

    <p id="welcome"></p>

  </div>


  <!-- ADD PRODUCT -->

  <div class="card">

    <h2>Add Product</h2>

    <form id="productForm">

      <input
        id="productName"
        type="text"
        placeholder="Product name"
        required>


      <textarea
        id="productDescription"
        placeholder="Description">
      </textarea>


      <input
        id="productPrice"
        type="number"
        step="0.01"
        min="0"
        placeholder="Price"
        required>


      <input
        id="productStock"
        type="number"
        min="0"
        placeholder="Stock"
        required>


      <input
        id="productImage"
        type="url"
        placeholder="Image URL (optional)">


      <button
        id="productButton"
        type="submit">

        Add Product

      </button>

    </form>


    <p
      id="productMessage"
      class="message"
      style="display:none">
    </p>

  </div>


  <!-- MY PRODUCTS -->

  <h2>
    My Products
  </h2>


  <div id="productList">

    Loading...

  </div>


</section>


</main>


<script>

/* =====================================
   SHIPNOVA RENDER API
===================================== */

const API =
  "https://shipnovashop-1.onrender.com";


/* =====================================
   STORAGE KEYS
===================================== */

const TOKEN_KEY =
  "shipnova_token";

const USER_KEY =
  "shipnova_user";


/* =====================================
   ELEMENTS
===================================== */

const authSection =
  document.getElementById(
    "authSection"
  );

const dashboardSection =
  document.getElementById(
    "dashboardSection"
  );


/* =====================================
   API HELPER
===================================== */

async function api(
  path,
  options = {}
){

  const token =
    localStorage.getItem(
      TOKEN_KEY
    );


  const headers = {

    "Content-Type":
      "application/json",

    ...(options.headers || {})

  };


  if(token){

    headers.Authorization =
      "Bearer " + token;

  }


  const response =
    await fetch(
      API + path,
      {
        ...options,
        headers
      }
    );


  let data = {};


  try{

    data =
      await response.json();

  }catch{

    data = {};

  }


  if(!response.ok){

    if(
      response.status === 401
    ){

      localStorage.removeItem(
        TOKEN_KEY
      );

      localStorage.removeItem(
        USER_KEY
      );

    }


    throw new Error(
      data.error ||
      data.message ||
      "Request failed (" +
      response.status +
      ")"
    );

  }


  return data;

}


/* =====================================
   GET USER
===================================== */

function getUser(){

  try{

    return JSON.parse(
      localStorage.getItem(
        USER_KEY
      ) || "null"
    );

  }catch{

    return null;

  }

}


/* =====================================
   SAVE AUTH
===================================== */

function saveAuth(data){

  if(
    !data ||
    !data.token ||
    !data.user
  ){

    throw new Error(
      "Invalid server response."
    );

  }


  localStorage.setItem(
    TOKEN_KEY,
    data.token
  );


  localStorage.setItem(
    USER_KEY,
    JSON.stringify(
      data.user
    )
  );

}


/* =====================================
   LOGOUT
===================================== */

function logout(){

  localStorage.removeItem(
    TOKEN_KEY
  );

  localStorage.removeItem(
    USER_KEY
  );

  window.location.replace(
    "login.html"
  );

}


/* =====================================
   SHOW MESSAGE
===================================== */

function showMessage(
  element,
  text,
  type
){

  element.textContent =
    text;

  element.className =
    "message " + type;

  element.style.display =
    "block";

}


/* =====================================
   SHOW DASHBOARD
===================================== */

function showDashboard(){

  const currentUser =
    getUser();

  const token =
    localStorage.getItem(
      TOKEN_KEY
    );


  if(
    !token ||
    !currentUser ||
    String(
      currentUser.role
    ).toLowerCase()
    !== "seller"
  ){

    authSection.style.display =
      "block";

    dashboardSection.style.display =
      "none";

    return;

  }


  authSection.style.display =
    "none";

  dashboardSection.style.display =
    "block";


  document
    .getElementById(
      "welcome"
    )
    .textContent =
      "Welcome, " +
      (
        currentUser.name ||
        "Seller"
      ) +
      "!";


  loadProducts();

}


/* =====================================
   SELLER LOGIN
===================================== */

document
  .getElementById(
    "loginForm"
  )
  .addEventListener(
    "submit",
    async function(e){

      e.preventDefault();


      const message =
        document.getElementById(
          "loginMessage"
        );

      const button =
        document.getElementById(
          "loginButton"
        );


      const email =
        document
          .getElementById(
            "loginEmail"
          )
          .value
          .trim()
          .toLowerCase();


      const password =
        document
          .getElementById(
            "loginPassword"
          )
          .value;


      showMessage(
        message,
        "Logging in...",
        ""
      );


      button.disabled =
        true;


      try{

        const result =
          await api(
            "/api/auth/login",
            {
              method:"POST",

              body:
                JSON.stringify({
                  email,
                  password
                })
            }
          );


        if(
          !result.user ||
          String(
            result.user.role
          ).toLowerCase()
          !== "seller"
        ){

          throw new Error(
            "This account is not a seller account."
          );

        }


        saveAuth(
          result
        );


        showMessage(
          message,
          "Seller login successful.",
          "success"
        );


        setTimeout(
          showDashboard,
          300
        );


      }catch(error){

        console.error(
          "Seller login:",
          error
        );


        showMessage(
          message,
          error.message ||
          "Seller login failed.",
          "error"
        );


        button.disabled =
          false;

      }

    }
  );


/* =====================================
   SELLER REGISTRATION
===================================== */

document
  .getElementById(
    "registerForm"
  )
  .addEventListener(
    "submit",
    async function(e){

      e.preventDefault();


      const message =
        document.getElementById(
          "registerMessage"
        );

      const button =
        document.getElementById(
          "registerButton"
        );


      const name =
        document
          .getElementById(
            "registerName"
          )
          .value
          .trim();


      const email =
        document
          .getElementById(
            "registerEmail"
          )
          .value
          .trim()
          .toLowerCase();


      const password =
        document
          .getElementById(
            "registerPassword"
          )
          .value;


      const confirm =
        document
          .getElementById(
            "registerConfirm"
          )
          .value;


      if(
        password.length < 6
      ){

        showMessage(
          message,
          "Password must be at least 6 characters.",
          "error"
        );

        return;

      }


      if(
        password !== confirm
      ){

        showMessage(
          message,
          "Passwords do not match.",
          "error"
        );

        return;

      }


      button.disabled =
        true;


      showMessage(
        message,
        "Creating seller account...",
        ""
      );


      try{

        const result =
          await api(
            "/api/auth/register",
            {
              method:"POST",

              body:
                JSON.stringify({

                  name:name,

                  email:email,

                  password:password,

                  role:"seller"

                })
            }
          );


        if(
          !result.user ||
          String(
            result.user.role
          ).toLowerCase()
          !== "seller"
        ){

          throw new Error(
            "Server did not create a seller account."
          );

        }


        saveAuth(
          result
        );


        showMessage(
          message,
          "Seller account created successfully.",
          "success"
        );


        setTimeout(
          showDashboard,
          300
        );


      }catch(error){

        console.error(
          "Seller registration:",
          error
        );


        showMessage(
          message,
          error.message ||
          "Seller registration failed.",
          "error"
        );


        button.disabled =
          false;

      }

    }
  );


/* =====================================
   LOAD SELLER PRODUCTS
===================================== */

async function loadProducts(){

  const list =
    document.getElementById(
      "productList"
    );


  const currentUser =
    getUser();


  if(
    !currentUser ||
    !currentUser.id
  ){

    return;

  }


  list.innerHTML =
    "<div class='card'>Loading products...</div>";


  try{

    const data =
      await api(
        "/api/products?seller=" +
        encodeURIComponent(
          currentUser.id
        )
      );


    if(
      !data.products ||
      data.products.length === 0
    ){

      list.innerHTML =
        `
        <div class="card">
          <p>No products yet.</p>
        </div>
        `;

      return;

    }


    list.innerHTML =
      data.products
        .map(
          function(product){

            return `

              <div class="card">

                <div class="row">

                  <div style="flex:1">

                    <h3>
                      ${escapeHtml(
                        product.name
                      )}
                    </h3>

                    <p>
                      ${escapeHtml(
                        product.description ||
                        ""
                      )}
                    </p>

                    <p>

                      <b>
                        ₹${escapeHtml(
                          String(
                            product.price
                          )
                        )}
                      </b>

                      · Stock
                      ${escapeHtml(
                        String(
                          product.stock
                        )
                      )}

                    </p>

                  </div>


                  <button
                    class="danger"
                    type="button"
                    onclick=
                      "deleteProduct(${product.id})">

                    Delete

                  </button>

                </div>

              </div>

            `;

          }
        )
        .join("");


  }catch(error){

    list.innerHTML =
      `
      <div class="card">

        <p class="error">
          ${escapeHtml(
            error.message
          )}
        </p>

      </div>
      `;

  }

}


/* =====================================
   ADD PRODUCT
===================================== */

document
  .getElementById(
    "productForm"
  )
  .addEventListener(
    "submit",
    async function(e){

      e.preventDefault();


      const message =
        document.getElementById(
          "productMessage"
        );

      const button =
        document.getElementById(
          "productButton"
        );


      const name =
        document
          .getElementById(
            "productName"
          )
          .value
          .trim();


      const description =
        document
          .getElementById(
            "productDescription"
          )
          .value
          .trim();


      const price =
        document
          .getElementById(
            "productPrice"
          )
          .value;


      const stock =
        document
          .getElementById(
            "productStock"
          )
          .value;


      const image =
        document
          .getElementById(
            "productImage"
          )
          .value
          .trim();


      if(!name){

        showMessage(
          message,
          "Product name is required.",
          "error"
        );

        return;

      }


      if(
        price === "" ||
        Number(price) < 0
      ){

        showMessage(
          message,
          "Please enter a valid price.",
          "error"
        );

        return;

      }


      button.disabled =
        true;


      showMessage(
        message,
        "Adding product...",
        ""
      );


      try{

        await api(
          "/api/products",
          {
            method:"POST",

            body:
              JSON.stringify({

                name:name,

                description:
                  description,

                price:
                  Number(price),

                stock:
                  Number(
                    stock || 0
                  ),

                image:image

              })
          }
        );


        showMessage(
          message,
          "Product added successfully.",
          "success"
        );


        document
          .getElementById(
            "productForm"
          )
          .reset();


        await loadProducts();


      }catch(error){

        showMessage(
          message,
          error.message ||
          "Could not add product.",
          "error"
        );

      }


      button.disabled =
        false;

    }
  );


/* =====================================
   DELETE PRODUCT
===================================== */

async function deleteProduct(id){

  if(
    !confirm(
      "Delete this product?"
    )
  ){

    return;

  }


  try{

    await api(
      "/api/products/" +
      id,
      {
        method:"DELETE"
      }
    );


    await loadProducts();


  }catch(error){

    alert(
      error.message
    );

  }

}


/* =====================================
   ESCAPE HTML
===================================== */

function escapeHtml(value){

  return String(
    value ?? ""
  )
  .replace(
    /&/g,
    "&amp;"
  )
  .replace(
    /</g,
    "&lt;"
  )
  .replace(
    />/g,
    "&gt;"
  )
  .replace(
    /"/g,
    "&quot;"
  )
  .replace(
    /'/g,
    "&#039;"
  );

}


/* =====================================
   START
===================================== */

showDashboard();

</script>

</body>
</html>
