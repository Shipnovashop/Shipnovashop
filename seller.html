<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Seller Dashboard - ShipNovaShop</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f4f7fb;
      font-family: Arial, sans-serif;
      color: #1f2937;
    }

    .topbar {
      background: #111827;
      color: white;
      padding: 14px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .topbar h2 {
      margin: 0;
      font-size: 19px;
    }

    .top-actions {
      display: flex;
      gap: 7px;
    }

    button {
      border: 0;
      border-radius: 7px;
      padding: 10px 14px;
      cursor: pointer;
      font-size: 14px;
    }

    .btn-primary {
      background: #2563eb;
      color: white;
    }

    .btn-success {
      background: #16a34a;
      color: white;
    }

    .btn-danger {
      background: #dc2626;
      color: white;
    }

    .btn-secondary {
      background: #6b7280;
      color: white;
    }

    .container {
      max-width: 1100px;
      margin: auto;
      padding: 18px;
    }

    .hidden {
      display: none !important;
    }

    .login-box,
    .card {
      background: white;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 3px 15px rgba(0,0,0,.07);
    }

    .login-box {
      max-width: 420px;
      margin: 60px auto;
    }

    h2,
    h3 {
      margin-top: 0;
    }

    .seller-info {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 18px;
    }

    .info-box {
      background: white;
      padding: 14px;
      border-radius: 10px;
      box-shadow: 0 2px 10px rgba(0,0,0,.05);
    }

    .info-label {
      font-size: 12px;
      color: #6b7280;
      margin-bottom: 4px;
    }

    .info-value {
      font-weight: bold;
      word-break: break-word;
    }

    .form-group {
      margin-bottom: 14px;
    }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 6px;
      font-size: 14px;
    }

    input,
    textarea {
      width: 100%;
      padding: 11px;
      border: 1px solid #d1d5db;
      border-radius: 7px;
      font-size: 14px;
      background: white;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    .image-section {
      border: 1px solid #dbe1ea;
      border-radius: 10px;
      padding: 14px;
      background: #fafbfc;
    }

    .image-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .file-label {
      background: #2563eb;
      color: white;
      padding: 11px;
      text-align: center;
      border-radius: 7px;
      cursor: pointer;
      display: block;
      font-weight: 600;
    }

    #imageFile {
      display: none;
    }

    .or {
      text-align: center;
      margin: 10px 0;
      color: #6b7280;
      font-size: 13px;
    }

    .preview-box {
      margin-top: 14px;
      text-align: center;
    }

    .preview-box img {
      max-width: 220px;
      max-height: 220px;
      border-radius: 10px;
      border: 1px solid #ddd;
      object-fit: contain;
      background: white;
    }

    .remove-image {
      margin-top: 8px;
      display: none;
    }

    .form-actions {
      display: flex;
      gap: 8px;
      margin-top: 16px;
    }

    .products-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      margin-top: 15px;
    }

    .product-card {
      background: white;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 2px 12px rgba(0,0,0,.06);
    }

    .product-image {
      width: 100%;
      height: 180px;
      object-fit: cover;
      background: #f3f4f6;
      display: block;
    }

    .no-image {
      height: 180px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f3f4f6;
      color: #9ca3af;
    }

    .product-body {
      padding: 14px;
    }

    .product-name {
      font-weight: bold;
      font-size: 16px;
      margin-bottom: 6px;
    }

    .product-price {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 5px;
    }

    .product-stock {
      font-size: 13px;
      color: #6b7280;
      margin-bottom: 10px;
    }

    .message {
      margin-top: 12px;
      padding: 10px;
      border-radius: 7px;
      display: none;
    }

    .success {
      background: #dcfce7;
      color: #166534;
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
    }

    .loading {
      text-align: center;
      padding: 20px;
      color: #6b7280;
    }

    @media (max-width: 800px) {
      .seller-info {
        grid-template-columns: 1fr 1fr;
      }

      .products-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 550px) {
      .topbar h2 {
        font-size: 15px;
      }

      .top-actions button {
        padding: 8px 9px;
        font-size: 12px;
      }

      .container {
        padding: 10px;
      }

      .seller-info {
        grid-template-columns: 1fr;
      }

      .products-grid {
        grid-template-columns: 1fr;
      }

      .image-buttons {
        grid-template-columns: 1fr;
      }

      .form-actions {
        flex-direction: column;
      }

      .form-actions button {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <!-- TOP BAR -->

  <div class="topbar">

    <h2>🚚 ShipNovaShop Seller</h2>

    <div class="top-actions">

      <button
        class="btn-secondary"
        onclick="location.href='index.html'"
      >
        Home
      </button>

      <button
        class="btn-danger"
        onclick="logout()"
      >
        Logout
      </button>

    </div>

  </div>


  <!-- LOGIN REQUIRED -->

  <div
    id="loginRequired"
    class="login-box hidden"
  >

    <h2>Seller Login Required</h2>

    <p>
      Please login as seller to access your dashboard.
    </p>

    <button
      class="btn-primary"
      onclick="location.href='seller-login.html'"
    >
      Seller Login
    </button>

  </div>


  <!-- DASHBOARD -->

  <main
    id="dashboard"
    class="container hidden"
  >

    <!-- SELLER INFO -->

    <div class="seller-info">

      <div class="info-box">
        <div class="info-label">Seller Name</div>
        <div
          class="info-value"
          id="sellerName"
        >
          -
        </div>
      </div>

      <div class="info-box">
        <div class="info-label">Business</div>
        <div
          class="info-value"
          id="businessName"
        >
          -
        </div>
      </div>

      <div class="info-box">
        <div class="info-label">GSTIN</div>
        <div
          class="info-value"
          id="gstNumber"
        >
          -
        </div>
      </div>

      <div class="info-box">
        <div class="info-label">Mobile</div>
        <div
          class="info-value"
          id="mobile"
        >
          -
        </div>
      </div>

      <div class="info-box">
        <div class="info-label">Email</div>
        <div
          class="info-value"
          id="email"
        >
          -
        </div>
      </div>

      <div class="info-box">
        <div class="info-label">Address</div>
        <div
          class="info-value"
          id="address"
        >
          -
        </div>
      </div>

    </div>


    <!-- ADD PRODUCT -->

    <section class="card">

      <h3>➕ Add New Product</h3>

      <form id="productForm">

        <div class="form-group">

          <label>
            Product Name *
          </label>

          <input
            type="text"
            id="productName"
            placeholder="Enter product name"
            required
          >

        </div>


        <div class="form-group">

          <label>
            Price *
          </label>

          <input
            type="number"
            id="productPrice"
            min="0"
            step="0.01"
            placeholder="Enter price"
            required
          >

        </div>


        <div class="form-group">

          <label>
            Stock *
          </label>

          <input
            type="number"
            id="productStock"
            min="0"
            placeholder="Enter stock quantity"
            required
          >

        </div>


        <!-- IMAGE -->

        <div class="form-group">

          <label>
            Product Image
          </label>

          <div class="image-section">

            <div class="image-buttons">

              <label
                for="imageFile"
                class="file-label"
              >
                🖼️ Choose Image
              </label>

              <button
                type="button"
                class="btn-secondary"
                onclick="useImageURL()"
              >
                🔗 Use Image URL
              </button>

            </div>

            <input
              type="file"
              id="imageFile"
              accept="image/*"
            >

            <div
              class="or"
              id="urlHint"
            >
              Or enter an image URL below
            </div>

            <input
              type="url"
              id="imageURL"
              placeholder="https://example.com/product.jpg"
            >

            <div
              class="preview-box"
              id="previewBox"
            ></div>

            <button
              type="button"
              id="removeImageBtn"
              class="btn-danger remove-image"
              onclick="removeImage()"
            >
              ❌ Remove Image
            </button>

          </div>

        </div>


        <!-- DESCRIPTION -->

        <div class="form-group">

          <label>
            Description
          </label>

          <textarea
            id="productDescription"
            placeholder="Enter product description"
          ></textarea>

        </div>


        <div class="form-actions">

          <button
            type="submit"
            class="btn-success"
            id="addProductBtn"
          >
            ➕ Add Product
          </button>

          <button
            type="reset"
            class="btn-secondary"
            onclick="resetImage()"
          >
            Reset
          </button>

        </div>

      </form>


      <div
        id="productMessage"
        class="message"
      ></div>

    </section>


    <!-- MY PRODUCTS -->

    <section
      class="card"
      style="margin-top:20px"
    >

      <div
        style="
          display:flex;
          justify-content:space-between;
          align-items:center;
          gap:10px;
          margin-bottom:10px;
        "
      >

        <h3 style="margin:0">
          📦 My Products
        </h3>

        <button
          class="btn-primary"
          onclick="loadProducts()"
        >
          Refresh
        </button>

      </div>

      <div
        id="productsGrid"
        class="products-grid"
      ></div>

    </section>

  </main>


<script>

const API =
  window.SHIPNOVA_API ||
  "https://shipnovashop.onrender.com";

const TOKEN_KEY = "shipnova_token";
const USER_KEY = "shipnova_user";


let selectedImageData = "";



/* =========================
   HELPERS
========================= */

function escapeHTML(value) {

  if (
    value === null ||
    value === undefined
  ) {
    return "";
  }

  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}


function getToken() {

  return localStorage.getItem(
    TOKEN_KEY
  );
}


function getUser() {

  try {

    return JSON.parse(
      localStorage.getItem(USER_KEY) || "{}"
    );

  } catch {

    return {};

  }
}


async function api(
  path,
  options = {}
) {

  const headers = {
    "Content-Type": "application/json",
    ...(options.headers || {})
  };

  const token = getToken();

  if (token) {

    headers.Authorization =
      "Bearer " + token;

  }

  const response =
    await fetch(
      API + path,
      {
        ...options,
        headers
      }
    );

  let data = {};

  try {

    data =
      await response.json();

  } catch {}

  if (!response.ok) {

    throw new Error(
      data.error ||
      "Request failed"
    );

  }

  return data;
}



/* =========================
   SHOW MESSAGE
========================= */

function showMessage(
  message,
  type = "success"
) {

  const box =
    document.getElementById(
      "productMessage"
    );

  box.textContent = message;

  box.className =
    "message " + type;

  box.style.display =
    "block";

}



/* =========================
   LOAD SELLER INFO
========================= */

function loadSellerInfo() {

  const user =
    getUser();

  document.getElementById(
    "sellerName"
  ).textContent =
    user.name || "-";

  document.getElementById(
    "businessName"
  ).textContent =
    user.businessName ||
    user.business_name ||
    "-";

  document.getElementById(
    "gstNumber"
  ).textContent =
    user.gstNumber ||
    user.gst_number ||
    "-";

  document.getElementById(
    "mobile"
  ).textContent =
    user.mobile || "-";

  document.getElementById(
    "email"
  ).textContent =
    user.email || "-";

  document.getElementById(
    "address"
  ).textContent =
    user.address || "-";

}



/* =========================
   IMAGE FILE SELECT
========================= */

document
  .getElementById("imageFile")
  .addEventListener(
    "change",
    function() {

      const file =
        this.files[0];

      if (!file) {
        return;
      }

      if (!file.type.startsWith("image/")) {

        alert(
          "Please select an image file."
        );

        this.value = "";

        return;
      }

      compressImage(file);

    }
  );



/* =========================
   COMPRESS IMAGE
========================= */

function compressImage(file) {

  const reader =
    new FileReader();

  reader.onload =
    function(event) {

      const img =
        new Image();

      img.onload =
        function() {

          const maxWidth = 900;
          const maxHeight = 900;

          let width =
            img.width;

          let height =
            img.height;


          if (
            width > maxWidth ||
            height > maxHeight
          ) {

            const ratio =
              Math.min(
                maxWidth / width,
                maxHeight / height
              );

            width =
              Math.round(
                width * ratio
              );

            height =
              Math.round(
                height * ratio
              );

          }


          const canvas =
            document.createElement(
              "canvas"
            );

          canvas.width =
            width;

          canvas.height =
            height;


          const ctx =
            canvas.getContext(
              "2d"
            );

          ctx.drawImage(
            img,
            0,
            0,
            width,
            height
          );


          /*
            JPEG quality 0.75
            keeps image small enough
            for Render API.
          */

          selectedImageData =
            canvas.toDataURL(
              "image/jpeg",
              0.75
            );


          document.getElementById(
            "imageURL"
          ).value = "";


          showPreview(
            selectedImageData
          );

        };

      img.src =
        event.target.result;

    };


  reader.readAsDataURL(file);

}



/* =========================
   IMAGE URL
========================= */

document
  .getElementById("imageURL")
  .addEventListener(
    "input",
    function() {

      const url =
        this.value.trim();

      if (!url) {

        return;

      }

      selectedImageData =
        url;

      showPreview(url);

    }
  );



function useImageURL() {

  const input =
    document.getElementById(
      "imageURL"
    );

  input.focus();

  input.scrollIntoView({
    behavior: "smooth",
    block: "center"
  });

}



function showPreview(src) {

  const box =
    document.getElementById(
      "previewBox"
    );

  box.innerHTML = `
    <img
      src="${escapeHTML(src)}"
      alt="Product Preview"
      onerror="imagePreviewError(this)"
    >
  `;

  document.getElementById(
    "removeImageBtn"
  ).style.display =
    "inline-block";

}



function imagePreviewError(img) {

  img.style.display =
    "none";

  const box =
    document.getElementById(
      "previewBox"
    );

  box.insertAdjacentHTML(
    "beforeend",
    `<p style="color:#dc2626">
      Image URL could not be loaded.
    </p>`
  );

}



/* =========================
   REMOVE IMAGE
========================= */

function removeImage() {

  selectedImageData = "";

  document.getElementById(
    "imageFile"
  ).value = "";

  document.getElementById(
    "imageURL"
  ).value = "";

  document.getElementById(
    "previewBox"
  ).innerHTML = "";

  document.getElementById(
    "removeImageBtn"
  ).style.display =
    "none";

}



function resetImage() {

  setTimeout(
    removeImage,
    50
  );

}



/* =========================
   ADD PRODUCT
========================= */

document
  .getElementById("productForm")
  .addEventListener(
    "submit",
    async function(e) {

      e.preventDefault();


      const name =
        document
          .getElementById(
            "productName"
          )
          .value
          .trim();


      const price =
        Number(
          document.getElementById(
            "productPrice"
          ).value
        );


      const stock =
        Number(
          document.getElementById(
            "productStock"
          ).value
        );


      const description =
        document
          .getElementById(
            "productDescription"
          )
          .value
          .trim();


      const url =
        document
          .getElementById(
            "imageURL"
          )
          .value
          .trim();


      /*
        If URL exists, use URL.
        Otherwise use uploaded/compressed image.
      */

      const image =
        url ||
        selectedImageData ||
        "";


      if (!name) {

        alert(
          "Please enter product name."
        );

        return;
      }


      if (
        Number.isNaN(price) ||
        price < 0
      ) {

        alert(
          "Please enter a valid price."
        );

        return;
      }


      if (
        Number.isNaN(stock) ||
        stock < 0
      ) {

        alert(
          "Please enter valid stock."
        );

        return;
      }


      const button =
        document.getElementById(
          "addProductBtn"
        );

      button.disabled =
        true;

      button.textContent =
        "Adding...";


      try {

        await api(
          "/api/products",
          {
            method: "POST",

            body: JSON.stringify({

              name,

              price,

              stock,

              image,

              description

            })
          }
        );


        showMessage(
          "Product added successfully!",
          "success"
        );


        document
          .getElementById(
            "productForm"
          )
          .reset();


        removeImage();


        await loadProducts();


      } catch (error) {

        showMessage(
          error.message ||
          "Failed to add product.",
          "error"
        );

      } finally {

        button.disabled =
          false;

        button.textContent =
          "➕ Add Product";

      }

    }
  );



/* =========================
   LOAD PRODUCTS
========================= */

async function loadProducts() {

  const grid =
    document.getElementById(
      "productsGrid"
    );

  grid.innerHTML =
    `<div class="loading">
      Loading products...
    </div>`;


  try {

    /*
      Public endpoint is used here.
      Seller's own active products
      are filtered below.
    */

    const data =
      await api(
        "/api/products"
      );


    const products =
      Array.isArray(data)
        ? data
        : (
            data.products ||
            []
          );


    const user =
      getUser();


    const sellerId =
      user.id;


    const myProducts =
      products.filter(
        product => {

          const productSeller =
            product.seller_id ??
            product.sellerId;

          return String(
            productSeller
          ) === String(
            sellerId
          );

        }
      );


    if (!myProducts.length) {

      grid.innerHTML =
        `<div
          class="loading"
          style="grid-column:1/-1"
        >
          No products found.
        </div>`;

      return;

    }


    grid.innerHTML =
      myProducts.map(
        product => {

          const image =
            product.image || "";


          const imageHTML =
            image
              ? `
                <img
                  class="product-image"
                  src="${escapeHTML(image)}"
                  alt="${escapeHTML(product.name)}"
                  onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"
                >

                <div
                  class="no-image"
                  style="display:none"
                >
                  🖼️ Image unavailable
                </div>
              `
              : `
                <div class="no-image">
                  🖼️ No Image
                </div>
              `;


          return `

            <div class="product-card">

              ${imageHTML}

              <div class="product-body">

                <div class="product-name">
                  ${escapeHTML(
                    product.name
                  )}
                </div>

                <div class="product-price">
                  ₹${Number(
                    product.price || 0
                  ).toLocaleString(
                    "en-IN"
                  )}
                </div>

                <div class="product-stock">
                  Stock:
                  ${escapeHTML(
                    product.stock ?? 0
                  )}
                </div>

                <button
                  class="btn-danger"
                  onclick="deleteProduct(${product.id})"
                >
                  🗑️ Delete
                </button>

              </div>

            </div>

          `;

        }
      ).join("");


  } catch (error) {

    grid.innerHTML =
      `<div
        class="loading"
        style="grid-column:1/-1;color:#dc2626"
      >
        ${escapeHTML(
          error.message
        )}
      </div>`;

  }

}



/* =========================
   DELETE PRODUCT
========================= */

async function deleteProduct(id) {

  if (
    !confirm(
      "Are you sure you want to delete this product?"
    )
  ) {

    return;

  }


  try {

    const result =
      await api(
        "/api/products/" + id,
        {
          method: "DELETE"
        }
      );


    alert(
      result.message ||
      "Product deleted successfully."
    );


    await loadProducts();


  } catch (error) {

    alert(
      error.message ||
      "Unable to delete product."
    );

  }

}



/* =========================
   LOGOUT
========================= */

function logout() {

  localStorage.removeItem(
    TOKEN_KEY
  );

  localStorage.removeItem(
    USER_KEY
  );

  location.href =
    "seller-login.html";

}



/* =========================
   INIT
========================= */

function init() {

  const token =
    getToken();

  const user =
    getUser();


  if (
    !token ||
    !user.id ||
    user.role !== "seller"
  ) {

    document
      .getElementById(
        "loginRequired"
      )
      .classList.remove(
        "hidden"
      );

    return;

  }


  document
    .getElementById(
      "dashboard"
    )
    .classList.remove(
      "hidden"
    );


  loadSellerInfo();

  loadProducts();

}
