<!doctype html>

<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Seller - ShipNova</title>
<link rel="stylesheet" href="style.css">
</head><body><nav>
  <b>ShipNova Seller</b>  <span>
    <a href="index.html">Home</a>
    <a href="product.html">Store</a>
    <button type="button" onclick="logout()">Logout</button>
  </span>
</nav><main class="container">  <!-- SELLER AUTH -->  <div id="authSection"><div class="grid">

  <!-- SELLER LOGIN -->
  <div class="card">

    <h2>Seller Login</h2>

    <form id="loginForm">

      <input
        id="loginEmail"
        type="email"
        placeholder="Email"
        required
      >

      <input
        id="loginPassword"
        type="password"
        placeholder="Password"
        required
      >

      <button type="submit">
        Seller Login
      </button>

    </form>

    <p id="loginMessage"></p>

  </div>

  <!-- SELLER REGISTER -->
  <div class="card">

    <h2>Seller Registration</h2>

    <form id="registerForm">

      <input
        id="registerName"
        type="text"
        placeholder="Full Name"
        required
      >

      <input
        id="registerEmail"
        type="email"
        placeholder="Email"
        required
      >

      <input
        id="registerPassword"
        type="password"
        placeholder="Password"
        minlength="6"
        required
      >

      <input
        id="registerConfirm"
        type="password"
        placeholder="Confirm Password"
        minlength="6"
        required
      >

      <button type="submit">
        Register as Seller
      </button>

    </form>

    <p id="registerMessage"></p>

  </div>

</div>

  </div>  <!-- SELLER DASHBOARD -->  <div id="dashboardSection" style="display:none"><div class="card">

  <h1>Seller Dashboard</h1>

  <p id="welcome"></p>

</div>


<div class="card">

  <h2>Add Product</h2>

  <form id="productForm">

    <input
      id="productName"
      type="text"
      placeholder="Product name"
      required
    >

    <textarea
      id="productDescription"
      placeholder="Description"
    ></textarea>

    <input
      id="productPrice"
      type="number"
      step="0.01"
      min="0"
      placeholder="Price"
      required
    >

    <input
      id="productStock"
      type="number"
      min="0"
      placeholder="Stock"
      required
    >

    <input
      id="productImage"
      type="text"
      placeholder="Image URL (optional)"
    >

    <button type="submit">
      Add Product
    </button>

  </form>

  <p id="productMessage"></p>

</div>


<h2>My Products</h2>

<div id="productList">
  Loading...
</div>

  </div></main><script src="api-config.js"></script><script src="app.js"></script><script>

let currentUser = user();


/* =========================
   SHOW SELLER DASHBOARD
========================= */

function showDashboard() {

  currentUser = user();

  if (!currentUser || currentUser.role !== 'seller') {
    document.getElementById('authSection').style.display = 'block';
    document.getElementById('dashboardSection').style.display = 'none';
    return;
  }

  document.getElementById('authSection').style.display = 'none';
  document.getElementById('dashboardSection').style.display = 'block';

  document.getElementById('welcome').textContent =
    'Welcome, ' + (currentUser.name || 'Seller') + '!';

  loadProducts();
}


/* =========================
   SELLER LOGIN
========================= */

document.getElementById('loginForm').addEventListener(
  'submit',
  async function(e) {

    e.preventDefault();

    const message = document.getElementById('loginMessage');

    message.className = '';
    message.textContent = 'Logging in...';

    try {

      const result = await api('/api/auth/login', {

        method: 'POST',

        body: JSON.stringify({

          email:
            document.getElementById('loginEmail').value.trim(),

          password:
            document.getElementById('loginPassword').value

        })

      });


      if (result.user.role !== 'seller') {

        message.className = 'error';
        message.textContent =
          'This account is not a seller account.';

        return;

      }


      saveAuth(result);

      message.className = 'success';
      message.textContent = 'Login successful.';

      showDashboard();

    } catch(error) {

      message.className = 'error';
      message.textContent = error.message;

    }

  }
);


/* =========================
   SELLER REGISTRATION
========================= */

document.getElementById('registerForm').addEventListener(
  'submit',
  async function(e) {

    e.preventDefault();

    const message =
      document.getElementById('registerMessage');

    const password =
      document.getElementById('registerPassword').value;

    const confirm =
      document.getElementById('registerConfirm').value;


    if (password !== confirm) {

      message.className = 'error';
      message.textContent =
        'Passwords do not match.';

      return;

    }


    message.className = '';
    message.textContent =
      'Creating seller account...';


    try {

      const result = await api('/api/auth/register', {

        method: 'POST',

        body: JSON.stringify({

          name:
            document.getElementById('registerName').value.trim(),

          email:
            document.getElementById('registerEmail').value.trim(),

          password: password,

          role: 'seller'

        })

      });


      saveAuth(result);

      message.className = 'success';
      message.textContent =
        'Seller account created successfully.';

      showDashboard();

    } catch(error) {

      message.className = 'error';
      message.textContent = error.message;

    }

  }
);


/* =========================
   LOAD SELLER PRODUCTS
========================= */

async function loadProducts() {

  const list =
    document.getElementById('productList');

  try {

    const data = await api(
      '/api/products?seller=' +
      encodeURIComponent(currentUser.id)
    );


    if (!data.products || data.products.length === 0) {

      list.innerHTML =
        '<div class="card">' +
        '<p>No products yet.</p>' +
        '</div>';

      return;

    }


    list.innerHTML = data.products.map(function(product) {

      return `

        <div class="card">

          <div class="row">

            <div style="flex:1">

              <h3>${escapeHtml(product.name)}</h3>

              <p>
                ${escapeHtml(
                  product.description || ''
                )}
              </p>

              <p>
                <b>₹${escapeHtml(
                  String(product.price)
                )}</b>
                · Stock ${escapeHtml(
                  String(product.stock)
                )}
              </p>

            </div>

            <button
              class="danger"
              type="button"
              onclick="deleteProduct(${product.id})">

              Delete

            </button>

          </div>

        </div>

      `;

    }).join('');


  } catch(error) {

    list.innerHTML =
      '<div class="card">' +
      '<p class="error">' +
      escapeHtml(error.message) +
      '</p>' +
      '</div>';

  }

}


/* =========================
   ADD PRODUCT
========================= */

document.getElementById('productForm').addEventListener(
  'submit',
  async function(e) {

    e.preventDefault();

    const message =
      document.getElementById('productMessage');

    message.className = '';
    message.textContent = 'Adding product...';


    try {

      await api('/api/products', {

        method: 'POST',

        body: JSON.stringify({

          name:
            document.getElementById('productName').value.trim(),

          description:
            document.getElementById('productDescription').value.trim(),

          price:
            Number(
              document.getElementById('productPrice').value
            ),

          stock:
            Number(
              document.getElementById('productStock').value || 0
            ),

          image:
            document.getElementById('productImage').value.trim()

        })

      });


      message.className = 'success';
      message.textContent =
        'Product added successfully.';


      document.getElementById('productForm').reset();

      loadProducts();


    } catch(error) {

      message.className = 'error';
      message.textContent = error.message;

    }

  }
);


/* =========================
   DELETE PRODUCT
========================= */

async function deleteProduct(id) {

  if (!confirm('Delete this product?')) {
    return;
  }


  try {

    await api('/api/products/' + id, {
      method: 'DELETE'
    });


    loadProducts();


  } catch(error) {

    alert(error.message);

  }

}


/* =========================
   HTML ESCAPE
========================= */

function escapeHtml(value) {

  return String(value)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');

}


/* =========================
   START
========================= */

showDashboard();

</script></body>
</html>
