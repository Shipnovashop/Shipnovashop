<!doctype html>
<html lang="en">
<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1">

<title>Seller - ShipNovaShop</title>

<link rel="stylesheet" href="style.css">

<style>

.auth-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:20px;
}

.message{
  margin-top:12px;
  padding:10px;
  border-radius:7px;
}

.error{
  background:#fee2e2;
  color:#991b1b;
}

.success{
  background:#dcfce7;
  color:#166534;
}

.info{
  background:#e0f2fe;
  color:#075985;
}

.card{
  margin-bottom:20px;
}

textarea{
  width:100%;
  min-height:100px;
  resize:vertical;
}

input,
textarea,
button{
  box-sizing:border-box;
}

.seller-info{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
  margin-top:15px;
}

.info-box{
  padding:12px;
  border:1px solid #ddd;
  border-radius:8px;
  background:#fafafa;
}

.product-card{
  margin-bottom:15px;
}

.product-image{
  width:100px;
  height:100px;
  object-fit:cover;
  border-radius:8px;
  margin-right:15px;
}

.product-row{
  display:flex;
  align-items:center;
  gap:15px;
}

.product-content{
  flex:1;
}

.danger{
  background:#dc2626;
  color:white;
  border:none;
  padding:10px 14px;
  border-radius:7px;
  cursor:pointer;
}

.danger:hover{
  background:#b91c1c;
}

.logout-btn{
  margin-left:10px;
}

@media(max-width:700px){

  .auth-grid{
    grid-template-columns:1fr;
  }

  .seller-info{
    grid-template-columns:1fr;
  }

  .product-row{
    flex-direction:column;
    align-items:flex-start;
  }

  .product-image{
    width:100%;
    height:180px;
  }

}

</style>

</head>


<body>


<!-- =====================================
     NAVIGATION
===================================== -->

<nav>

  <b>ShipNova Seller</b>

  <span>

    <a href="index.html">
      Home
    </a>

    <a href="product.html">
      Store
    </a>

    <button
      type="button"
      class="logout-btn"
      onclick="logout()">

      Logout

    </button>

  </span>

</nav>


<main class="container">


<!-- =====================================
     SELLER AUTH SECTION
===================================== -->

<section id="authSection">

  <div class="auth-grid">


    <!-- =================================
         SELLER LOGIN
    ================================== -->

    <div class="card">

      <h2>Seller Login</h2>

      <form id="loginForm">

        <input
          id="loginEmail"
          type="email"
          placeholder="Email"
          autocomplete="username"
          required>

        <input
          id="loginPassword"
          type="password"
          placeholder="Password"
          autocomplete="current-password"
          required>

        <button
          id="loginButton"
          type="submit">

          Seller Login

        </button>

      </form>

      <p
        id="loginMessage"
        class="message"
        style="display:none">
      </p>

    </div>


    <!-- =================================
         SELLER REGISTRATION
    ================================== -->

    <div class="card">

      <h2>Seller Registration</h2>

      <form id="registerForm">


        <input
          id="registerName"
          type="text"
          placeholder="Full Name"
          autocomplete="name"
          required>


        <input
          id="registerBusinessName"
          type="text"
          placeholder="Business Name"
          autocomplete="organization"
          required>


        <input
          id="registerGST"
          type="text"
          placeholder="GST Number / GSTIN"
          maxlength="15"
          style="text-transform:uppercase"
          required>


        <input
          id="registerMobile"
          type="tel"
          placeholder="Mobile Number"
          maxlength="10"
          inputmode="numeric"
          autocomplete="tel"
          required>


        <textarea
          id="registerAddress"
          placeholder="Business / Pickup Address"
          autocomplete="street-address"
          required></textarea>


        <input
          id="registerEmail"
          type="email"
          placeholder="Email"
          autocomplete="email"
          required>


        <input
          id="registerPassword"
          type="password"
          placeholder="Password"
          minlength="6"
          autocomplete="new-password"
          required>


        <input
          id="registerConfirm"
          type="password"
          placeholder="Confirm Password"
          minlength="6"
          autocomplete="new-password"
          required>


        <button
          id="registerButton"
          type="submit">

          Register as Seller

        </button>

      </form>


      <p
        id="registerMessage"
        class="message"
        style="display:none">
      </p>

    </div>

  </div>

</section>


<!-- =====================================
     SELLER DASHBOARD
===================================== -->

<section
  id="dashboardSection"
  style="display:none">


  <!-- SELLER DETAILS -->

  <div class="card">

    <h1>Seller Dashboard</h1>

    <p id="welcome"></p>

    <div
      id="sellerInfo"
      class="seller-info">
    </div>

  </div>


  <!-- =================================
       ADD PRODUCT
  ================================== -->

  <div class="card">

    <h2>Add Product</h2>

    <form id="productForm">


      <input
        id="productName"
        type="text"
        placeholder="Product name"
        required>


      <textarea
        id="productDescription"
        placeholder="Product description"></textarea>


      <input
        id="productPrice"
        type="number"
        step="0.01"
        min="0"
        placeholder="Price"
        required>


      <input
        id="productStock"
        type="number"
        min="0"
        placeholder="Stock"
        required>


      <input
        id="productImage"
        type="url"
        placeholder="Image URL (optional)">


      <button
        id="productButton"
        type="submit">

        Add Product

      </button>


    </form>


    <p
      id="productMessage"
      class="message"
      style="display:none">
    </p>

  </div>


  <!-- =================================
       MY PRODUCTS
  ================================== -->

  <h2>
    My Products
  </h2>


  <div id="productList">

    Loading...

  </div>


</section>


</main>


<script>


/* =====================================
   SHIPNOVA RENDER API
===================================== */

const API =
  "https://shipnovashop.onrender.com";


/* =====================================
   STORAGE KEYS
===================================== */

const TOKEN_KEY =
  "shipnova_token";

const USER_KEY =
  "shipnova_user";


/* =====================================
   ELEMENTS
===================================== */

const authSection =
  document.getElementById(
    "authSection"
  );

const dashboardSection =
  document.getElementById(
    "dashboardSection"
  );


/* =====================================
   API HELPER
===================================== */

async function api(
  path,
  options = {}
){

  const token =
    localStorage.getItem(
      TOKEN_KEY
    );


  const headers = {

    "Content-Type":
      "application/json",

    ...(options.headers || {})

  };


  if(token){

    headers.Authorization =
      "Bearer " + token;

  }


  const response =
    await fetch(
      API + path,
      {
        ...options,
        headers
      }
    );


  let data = {};


  try{

    data =
      await response.json();

  }catch{

    data = {};

  }


  if(!response.ok){

    if(
      response.status === 401
    ){

      localStorage.removeItem(
        TOKEN_KEY
      );

      localStorage.removeItem(
        USER_KEY
      );

    }


    throw new Error(
      data.error ||
      data.message ||
      "Request failed (" +
      response.status +
      ")"
    );

  }


  return data;

}


/* =====================================
   GET USER
===================================== */

function getUser(){

  try{

    return JSON.parse(
      localStorage.getItem(
        USER_KEY
      ) || "null"
    );

  }catch{

    return null;

  }

}


/* =====================================
   SAVE AUTH
===================================== */

function saveAuth(data){

  if(
    !data ||
    !data.token ||
    !data.user
  ){

    throw new Error(
      "Invalid server response."
    );

  }


  localStorage.setItem(
    TOKEN_KEY,
    data.token
  );


  localStorage.setItem(
    USER_KEY,
    JSON.stringify(
      data.user
    )
  );

}


/* =====================================
   LOGOUT
===================================== */

function logout(){

  localStorage.removeItem(
    TOKEN_KEY
  );

  localStorage.removeItem(
    USER_KEY
  );


  window.location.replace(
    "index.html"
  );

}


/* =====================================
   SHOW MESSAGE
===================================== */

function showMessage(
  element,
  text,
  type = ""
){

  element.textContent =
    text;

  element.className =
    "message " + type;

  element.style.display =
    "block";

}


/* =====================================
   SHOW SELLER INFORMATION
===================================== */

function showSellerInfo(user){

  const info =
    document.getElementById(
      "sellerInfo"
    );


  info.innerHTML = `

    <div class="info-box">
      <strong>Name</strong>
      <br>
      ${escapeHtml(
        user.name || ""
      )}
    </div>

    <div class="info-box">
      <strong>Business</strong>
      <br>
      ${escapeHtml(
        user.businessName || "Not provided"
      )}
    </div>

    <div class="info-box">
      <strong>GSTIN</strong>
      <br>
      ${escapeHtml(
        user.gstNumber || "Not provided"
      )}
    </div>

    <div class="info-box">
      <strong>Mobile</strong>
      <br>
      ${escapeHtml(
        user.mobile || "Not provided"
      )}
    </div>

    <div class="info-box">
      <strong>Email</strong>
      <br>
      ${escapeHtml(
        user.email || ""
      )}
    </div>

    <div class="info-box">
      <strong>Address</strong>
      <br>
      ${escapeHtml(
        user.address || "Not provided"
      )}
    </div>

  `;

}


/* =====================================
   SHOW DASHBOARD
===================================== */

function showDashboard(){

  const currentUser =
    getUser();

  const token =
    localStorage.getItem(
      TOKEN_KEY
    );


  if(
    !token ||
    !currentUser ||
    String(
      currentUser.role
    ).toLowerCase()
    !== "seller"
  ){

    authSection.style.display =
      "block";

    dashboardSection.style.display =
      "none";

    return;

  }


  authSection.style.display =
    "none";

  dashboardSection.style.display =
    "block";


  document
    .getElementById(
      "welcome"
    )
    .textContent =
      "Welcome, " +
      (
        currentUser.name ||
        "Seller"
      ) +
      "!";


  showSellerInfo(
    currentUser
  );


  loadProducts();

}


/* =====================================
   SELLER LOGIN
===================================== */

document
  .getElementById(
    "loginForm"
  )
  .addEventListener(
    "submit",
    async function(e){

      e.preventDefault();


      const message =
        document.getElementById(
          "loginMessage"
        );

      const button =
        document.getElementById(
          "loginButton"
        );


      const email =
        document
          .getElementById(
            "loginEmail"
          )
          .value
          .trim()
          .toLowerCase();


      const password =
        document
          .getElementById(
            "loginPassword"
          )
          .value;


      button.disabled =
        true;


      showMessage(
        message,
        "Logging in...",
        "info"
      );


      try{

        const result =
          await api(
            "/api/auth/login",
            {
              method:"POST",

              body:
                JSON.stringify({

                  email:email,

                  password:password

                })

            }
          );


        if(
          !result.user ||
          String(
            result.user.role
          ).toLowerCase()
          !== "seller"
        ){

          throw new Error(
            "This account is not a seller account."
          );

        }


        if(
          !result.token
        ){

          throw new Error(
            "Login token was not received."
          );

        }


        saveAuth(
          result
        );


        showMessage(
          message,
          "Seller login successful.",
          "success"
        );


        setTimeout(
          showDashboard,
          300
        );


      }catch(error){

        console.error(
          "Seller login:",
          error
        );


        showMessage(
          message,
          error.message ||
          "Seller login failed.",
          "error"
        );


        button.disabled =
          false;

      }

    }
  );


/* =====================================
   SELLER REGISTRATION
===================================== */

document
  .getElementById(
    "registerForm"
  )
  .addEventListener(
    "submit",
    async function(e){

      e.preventDefault();


      const message =
        document.getElementById(
          "registerMessage"
        );

      const button =
        document.getElementById(
          "registerButton"
        );


      const name =
        document
          .getElementById(
            "registerName"
          )
          .value
          .trim();


      const businessName =
        document
          .getElementById(
            "registerBusinessName"
          )
          .value
          .trim();


      const gstNumber =
        document
          .getElementById(
            "registerGST"
          )
          .value
          .trim()
          .toUpperCase();


      const mobile =
        document
          .getElementById(
            "registerMobile"
          )
          .value
          .trim();


      const address =
        document
          .getElementById(
            "registerAddress"
          )
          .value
          .trim();


      const email =
        document
          .getElementById(
            "registerEmail"
          )
          .value
          .trim()
          .toLowerCase();


      const password =
        document
          .getElementById(
            "registerPassword"
          )
          .value;


      const confirm =
        document
          .getElementById(
            "registerConfirm"
          )
          .value;


      /* PASSWORD */

      if(
        password.length < 6
      ){

        showMessage(
          message,
          "Password must be at least 6 characters.",
          "error"
        );

        return;

      }


      /* CONFIRM PASSWORD */

      if(
        password !== confirm
      ){

        showMessage(
          message,
          "Passwords do not match.",
          "error"
        );

        return;

      }


      /* GST VALIDATION */

      const gstRegex =
        /^[0-9]{2}[A-Z]{5}[0-9]{4}[A-Z][1-9A-Z]Z[0-9A-Z]$/;


      if(
        !gstRegex.test(
          gstNumber
        )
      ){

        showMessage(
          message,
          "Please enter a valid 15-character GSTIN.",
          "error"
        );

        return;

      }


      /* MOBILE VALIDATION */

      const mobileRegex =
        /^[6-9][0-9]{9}$/;


      if(
        !mobileRegex.test(
          mobile
        )
      ){

        showMessage(
          message,
          "Please enter a valid 10-digit mobile number.",
          "error"
        );

        return;

      }


      /* REQUIRED FIELDS */

      if(
        !name ||
        !businessName ||
        !address
      ){

        showMessage(
          message,
          "Please fill all required seller details.",
          "error"
        );

        return;

      }


      button.disabled =
        true;


      showMessage(
        message,
        "Creating seller account...",
        "info"
      );


      try{

        const result =
          await api(
            "/api/auth/register",
            {
              method:"POST",

              body:
                JSON.stringify({

                  name:name,

                  email:email,

                  password:password,

                  role:"seller",

                  businessName:
                    businessName,

                  gstNumber:
                    gstNumber,

                  mobile:
                    mobile,

                  address:
                    address

                })

            }
          );


        if(
          !result.user ||
          String(
            result.user.role
          ).toLowerCase()
          !== "seller"
        ){

          throw new Error(
            "Server did not create a seller account."
          );

        }


        if(
          !result.token
        ){

          throw new Error(
            "Registration token was not received."
          );

        }


        saveAuth(
          result
        );


        showMessage(
          message,
          "Seller account created successfully.",
          "success"
        );


        setTimeout(
          showDashboard,
          500
        );


      }catch(error){

        console.error(
          "Seller registration:",
          error
        );


        showMessage(
          message,
          error.message ||
          "Seller registration failed.",
          "error"
        );


        button.disabled =
          false;

      }

    }
  );


/* =====================================
   LOAD SELLER PRODUCTS
===================================== */

async function loadProducts(){

  const list =
    document.getElementById(
      "productList"
    );


  const currentUser =
    getUser();


  if(
    !currentUser ||
    !currentUser.id
  ){

    list.innerHTML =
      `
      <div class="card">
        <p>Seller information not found.</p>
      </div>
      `;

    return;

  }


  list.innerHTML =
    `
    <div class="card">
      Loading products...
    </div>
    `;


  try{

    const data =
      await api(
        "/api/products?seller=" +
        encodeURIComponent(
          currentUser.id
        )
      );


    if(
      !data.products ||
      data.products.length === 0
    ){

      list.innerHTML =
        `
        <div class="card">

          <p>
            No products yet.
          </p>

          <p>
            Use the Add Product form above
            to add your first product.
          </p>

        </div>
        `;

      return;

    }


    list.innerHTML =
      data.products
        .map(
          function(product){

            const image =
              product.image
                ? `
                  <img
                    class="product-image"
                    src="${escapeHtml(
                      product.image
                    )}"
                    alt="${escapeHtml(
                      product.name
                    )}"
                    onerror="this.style.display='none'">
                `
                : "";


            return `

              <div class="card product-card">

                <div class="product-row">

                  ${image}

                  <div class="product-content">

                    <h3>
                      ${escapeHtml(
                        product.name
                      )}
                    </h3>

                    <p>
                      ${escapeHtml(
                        product.description || ""
                      )}
                    </p>

                    <p>

                      <b>
                        ₹${escapeHtml(
                          Number(
                            product.price || 0
                          ).toFixed(2)
                        )}
                      </b>

                      &nbsp;·&nbsp;

                      Stock:
                      ${escapeHtml(
                        String(
                          product.stock ?? 0
                        )
                      )}

                    </p>

                  </div>


                  <button
                    class="danger"
                    type="button"
                    onclick="deleteProduct(${Number(
                      product.id
                    )})">

                    Delete

                  </button>

                </div>

              </div>

            `;

          }
        )
        .join("");


  }catch(error){

    console.error(
      "Load products:",
      error
    );


    list.innerHTML =
      `
      <div class="card">

        <p class="error">
          ${escapeHtml(
            error.message
          )}
        </p>

      </div>
      `;

  }

}


/* =====================================
   ADD PRODUCT
===================================== */

document
  .getElementById(
    "productForm"
  )
  .addEventListener(
    "submit",
    async function(e){

      e.preventDefault();


      const message =
        document.getElementById(
          "productMessage"
        );

      const button =
        document.getElementById(
          "productButton"
        );


      const name =
        document
          .getElementById(
            "productName"
          )
          .value
          .trim();


      const description =
        document
          .getElementById(
            "productDescription"
          )
          .value
          .trim();


      const price =
        document
          .getElementById(
            "productPrice"
          )
          .value;


      const stock =
        document
          .getElementById(
            "productStock"
          )
          .value;


      const image =
        document
          .getElementById(
            "productImage"
          )
          .value
          .trim();


      if(!name){

        showMessage(
          message,
          "Product name is required.",
          "error"
        );

        return;

      }


      if(
        price === "" ||
        Number(price) < 0 ||
        !Number.isFinite(
          Number(price)
        )
      ){

        showMessage(
          message,
          "Please enter a valid price.",
          "error"
        );

        return;

      }


      if(
        stock === "" ||
        Number(stock) < 0 ||
        !Number.isInteger(
          Number(stock)
        )
      ){

        showMessage(
          message,
          "Please enter a valid stock quantity.",
          "error"
        );

        return;

      }


      button.disabled =
        true;


      showMessage(
        message,
        "Adding product...",
        "info"
      );


      try{

        await api(
          "/api/products",
          {
            method:"POST",

            body:
              JSON.stringify({

                name:name,

                description:
                  description,

                price:
                  Number(price),

                stock:
                  Number(stock),

                image:
                  image

              })

          }
        );


        showMessage(
          message,
          "Product added successfully.",
          "success"
        );


        document
          .getElementById(
            "productForm"
          )
          .reset();


        await loadProducts();


      }catch(error){

        console.error(
          "Add product:",
          error
        );


        showMessage(
          message,
          error.message ||
          "Could not add product.",
          "error"
        );

      }


      button.disabled =
        false;

    }
  );


/* =====================================
   DELETE PRODUCT
===================================== */

async function deleteProduct(id){

  if(
    !confirm(
      "Delete this product?"
    )
  ){

    return;

  }


  try{

    await api(
      "/api/products/" +
      encodeURIComponent(id),
      {
        method:"DELETE"
      }
    );


    await loadProducts();


  }catch(error){

    console.error(
      "Delete product:",
      error
    );


    alert(
      error.message ||
      "Could not delete product."
    );

  }

}


/* =====================================
   ESCAPE HTML
===================================== */

function escapeHtml(value){

  return String(
    value ?? ""
  )

  .replace(
    /&/g,
    "&amp;"
  )

  .replace(
    /</g,
    "&lt;"
  )

  .replace(
    />/g,
    "&gt;"
  )

  .replace(
    /"/g,
    "&quot;"
  )

  .replace(
    /'/g,
    "&#039;"
  );

}


/* =====================================
   START
===================================== */

show
