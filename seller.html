<!doctype html><html><head><meta charset="utf-8"><title>Seller</title><link rel="stylesheet" href="style.css"></head><body><nav><b>Seller Dashboard</b><span><a href="product.html">Store</a><button onclick="logout()">Logout</button></span></nav><main class="container"><div class="card"><h2>Add Product</h2><form id="form"><input id="name" placeholder="Product name" required><textarea id="description" placeholder="Description"></textarea><input id="price" type="number" step="0.01" placeholder="Price" required><input id="stock" type="number" placeholder="Stock" required><input id="image" placeholder="Image URL (optional)"><button>Add Product</button></form><p id="msg"></p></div><h2>My Products</h2><div id="list"></div></main><script src="api-config.js"></script><script src="app.js"></script><script>if(!user()||user().role!=='seller'){location.href='index.html'}async function load(){const d=await api('/api/products?seller='+user().id);list.innerHTML=d.products.map(p=>`<div class="card"><div class="row"><div style="flex:1"><b>${p.name}</b><p>₹${p.price} · Stock ${p.stock}</p></div><button class="danger" onclick="del(${p.id})">Delete</button></div></div>`).join('')||'<p>No products yet.</p>'}async function del(id){if(confirm('Delete product?')){await api('/api/products/'+id,{method:'DELETE'});load()}}form.onsubmit=async e=>{e.preventDefault();try{await api('/api/products',{method:'POST',body:JSON.stringify({name:name.value,description:description.value,price:price.value,stock:stock.value,image:image.value})});msg.className='success';msg.textContent='Product added successfully';form.reset();load()}catch(x){msg.className='error';msg.textContent=x.message}};load()</script></body></html>
