<!doctype html><html><head><meta charset="utf-8"><title>ShipNova</title><link rel="stylesheet" href="style.css"></head><body><nav><b>ShipNova</b><span><a href="product.html">Products</a> <a href="customer.html">Customer</a> <a href="seller.html">Seller</a> <a href="admin.html">Admin</a></span></nav><main class="container"><div class="card"><h1>ShipNova Marketplace</h1><p>Customer, seller and admin dashboard with Cloudflare D1.</p></div><div class="grid"><div class="card"><h2>Login</h2><form id="login"><input id="email" type="email" placeholder="Email" required><input id="password" type="password" placeholder="Password" required><button>Login</button></form><p id="msg"></p><p>Admin demo: <b>admin@shipnova.local</b> / <b>admin123</b></p></div><div class="card"><h2>Register Seller</h2><form id="reg"><input id="name" placeholder="Name" required><input id="re" type="email" placeholder="Email" required><input id="rp" type="password" placeholder="Password" required><button>Register</button></form><p id="rm"></p></div></div></main><script src="api-config.js"></script><script src="app.js"></script><script>login.onsubmit=async e=>{e.preventDefault();try{saveAuth(await api('/api/auth/login',{method:'POST',body:JSON.stringify({email:email.value,password:password.value})}));location.href=user().role==='admin'?'admin.html':user().role==='seller'?'seller.html':'customer.html'}catch(x){msg.className='error';msg.textContent=x.message}};reg.onsubmit=async e=>{e.preventDefault();try{saveAuth(await api('/api/auth/register',{method:'POST',body:JSON.stringify({name:name.value,email:re.value,password:rp.value,role:'seller'})}));location.href='seller.html'}catch(x){rm.className='error';rm.textContent=x.message}}</script></body></html>
