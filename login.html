<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login - ShipNovaShop</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      min-height: 100vh;
      background: #f5f7fb;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 430px;
      background: #fff;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 10px 35px rgba(0,0,0,.08);
    }

    .logo {
      text-align: center;
      font-size: 29px;
      font-weight: 800;
      color: #2563eb;
      margin-bottom: 7px;
    }

    .logo span {
      color: #111827;
    }

    .subtitle {
      text-align: center;
      color: #6b7280;
      margin-bottom: 25px;
    }

    .tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 7px;
      margin-bottom: 22px;
    }

    .tab {
      padding: 10px 5px;
      border: 1px solid #d1d5db;
      background: white;
      border-radius: 7px;
      cursor: pointer;
      font-weight: 600;
      color: #374151;
    }

    .tab.active {
      background: #2563eb;
      color: white;
      border-color: #2563eb;
    }

    .field {
      margin-bottom: 17px;
    }

    label {
      display: block;
      font-weight: 600;
      color: #374151;
      margin-bottom: 7px;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: #2563eb;
    }

    .login-btn {
      width: 100%;
      padding: 13px;
      border: 0;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    .login-btn:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .message {
      display: none;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 18px;
      font-size: 14px;
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
    }

    .success {
      background: #dcfce7;
      color: #166534;
    }

    .links {
      text-align: center;
      margin-top: 22px;
      line-height: 1.9;
    }

    .links a {
      color: #2563eb;
      text-decoration: none;
      font-weight: 600;
    }

    .role-info {
      text-align: center;
      margin-bottom: 18px;
      font-size: 14px;
      color: #6b7280;
    }
  </style>
</head>

<body>

<div class="card">

  <div class="logo">
    ShipNova<span>Shop</span>
  </div>

  <p class="subtitle">
    Sign in to your account
  </p>

  <div class="tabs">

    <button class="tab active" data-role="customer">
      Customer
    </button>

    <button class="tab" data-role="seller">
      Seller
    </button>

    <button class="tab" data-role="admin">
      Admin
    </button>

  </div>

  <div id="roleInfo" class="role-info">
    Customer login
  </div>

  <div id="message" class="message"></div>

  <form id="loginForm">

    <div class="field">

      <label for="email">
        Email
      </label>

      <input
        type="email"
        id="email"
        placeholder="Enter your email"
        required
        autocomplete="email"
      >

    </div>

    <div class="field">

      <label for="password">
        Password
      </label>

      <input
        type="password"
        id="password"
        placeholder="Enter your password"
        required
        autocomplete="current-password"
      >

    </div>

    <button
      type="submit"
      class="login-btn"
      id="loginButton"
    >
      Login
    </button>

  </form>

  <div class="links">

    <div>
      Don't have an account?
      <a href="register.html">Register</a>
    </div>

    <div>
      <a href="index.html">← Back to Home</a>
    </div>

  </div>

</div>


<script src="api-config.js"></script>

<script>

const API =
  window.SHIPNOVA_API ||
  "https://shipnovashop-1.onrender.com";


let selectedRole = "customer";


const tabs =
  document.querySelectorAll(".tab");

const roleInfo =
  document.getElementById("roleInfo");

const form =
  document.getElementById("loginForm");

const button =
  document.getElementById("loginButton");

const message =
  document.getElementById("message");


function showMessage(text, type) {

  message.textContent = text;

  message.className =
    "message " + type;

  message.style.display = "block";
}


tabs.forEach(tab => {

  tab.addEventListener("click", () => {

    tabs.forEach(t =>
      t.classList.remove("active")
    );

    tab.classList.add("active");

    selectedRole =
      tab.dataset.role;

    roleInfo.textContent =
      selectedRole.charAt(0).toUpperCase() +
      selectedRole.slice(1) +
      " login";

    message.style.display = "none";

  });

});


form.addEventListener("submit", async event => {

  event.preventDefault();

  const email =
    document.getElementById("email")
      .value
      .trim();

  const password =
    document.getElementById("password")
      .value;


  if (!email || !password) {

    showMessage(
      "Email and password are required.",
      "error"
    );

    return;
  }


  button.disabled = true;

  button.textContent =
    "Logging in...";


  message.style.display =
    "none";


  try {

    const response =
      await fetch(
        API.replace(/\/$/, "") +
        "/api/auth/login",
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body: JSON.stringify({
            email,
            password
          })
        }
      );


    let data = {};

    try {
      data = await response.json();
    } catch {
      data = {};
    }


    if (!response.ok) {

      throw new Error(
        data.error ||
        data.message ||
        "Invalid email or password"
      );

    }


    const token =
      data.token;


    const user =
      data.user;


    if (!token || !user) {

      throw new Error(
        "Invalid server response."
      );

    }


    /*
     * IMPORTANT:
     * The role returned by the
     * database is trusted.
     */

    const actualRole =
      String(user.role || "")
        .toLowerCase();


    /*
     * Prevent a customer from
     * selecting Seller/Admin and
     * being redirected there.
     */

    if (actualRole !== selectedRole) {

      throw new Error(
        "This account is a " +
        actualRole +
        " account. Please select " +
        actualRole +
        " login."
      );

    }


    localStorage.setItem(
      "shipnova_token",
      token
    );


    localStorage.setItem(
      "shipnova_user",
      JSON.stringify(user)
    );


    showMessage(
      "Login successful. Redirecting...",
      "success"
    );


    setTimeout(() => {

      if (actualRole === "admin") {

        window.location.href =
          "admin.html";

      }

      else if (actualRole === "seller") {

        window.location.href =
          "seller.html";

      }

      else {

        window.location.href =
          "customer.html";

      }

    }, 600);


  } catch (error) {

    console.error(
      "Login error:",
      error
    );


    showMessage(
      error.message ||
      "Unable to connect to server.",
      "error"
    );

  }


  button.disabled = false;

  button.textContent =
    "Login";

});

</script>

</body>
</html>
