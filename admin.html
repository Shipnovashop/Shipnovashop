<!doctype html>

<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin - ShipNova</title>
<link rel="stylesheet" href="style.css">
</head><body><nav>
  <b>ShipNova Admin</b>
  <span>
    <a href="index.html">Home</a>
    <a href="product.html">Store</a>
    <button type="button" onclick="logout()">Logout</button>
  </span>
</nav><main class="container">  <!-- ADMIN LOGIN -->  <div id="loginSection"><div class="card" style="max-width:500px;margin:40px auto">

  <h1>Admin Login</h1>

  <form id="loginForm">

    <input
      id="email"
      type="email"
      placeholder="Admin Email"
      value="admin@shipnova.local"
      required
    >

    <input
      id="password"
      type="password"
      placeholder="Password"
      value="admin123"
      required
    >

    <button type="submit">Admin Login</button>

  </form>

  <p id="loginMessage"></p>

</div>

  </div>  <!-- ADMIN DASHBOARD -->  <div id="dashboardSection" style="display:none"><div class="card">
  <h1>Admin Dashboard</h1>
  <p id="welcome"></p>
</div>

<div id="stats" class="stats"></div>


<!-- ADD PRODUCT -->
<div class="card">

  <h2>Add Product</h2>

  <form id="productForm">

    <select id="seller" required>
      <option value="">Select Seller</option>
    </select>

    <input
      id="productName"
      type="text"
      placeholder="Product name"
      required
    >

    <textarea
      id="description"
      placeholder="Description"
    ></textarea>

    <input
      id="price"
      type="number"
      step="0.01"
      min="0"
      placeholder="Price"
      required
    >

    <input
      id="stock"
      type="number"
      min="0"
      placeholder="Stock"
      required
    >

    <input
      id="image"
      type="text"
      placeholder="Image URL (optional)"
    >

    <button type="submit">Add Product</button>

  </form>

  <p id="productMessage"></p>

</div>


<!-- USERS -->
<div class="card">

  <h2>Users</h2>

  <div id="users">
    Loading...
  </div>

</div>


<!-- PRODUCTS -->
<div class="card">

  <h2>All Products</h2>

  <div id="products">
    Loading...
  </div>

</div>

  </div></main><script src="api-config.js"></script><script src="app.js"></script><script>

const loginSection =
  document.getElementById('loginSection');

const dashboardSection =
  document.getElementById('dashboardSection');

const loginMessage =
  document.getElementById('loginMessage');

const productMessage =
  document.getElementById('productMessage');


/* =========================
   ADMIN LOGIN
========================= */

document.getElementById('loginForm').addEventListener(
  'submit',
  async function(e) {

    e.preventDefault();

    loginMessage.className = '';
    loginMessage.textContent = 'Logging in...';

    try {

      const result = await api('/api/auth/login', {

        method: 'POST',

        body: JSON.stringify({

          email:
            document.getElementById('email').value.trim(),

          password:
            document.getElementById('password').value

        })

      });


      if (!result.user || result.user.role !== 'admin') {

        loginMessage.className = 'error';
        loginMessage.textContent =
          'This account is not an admin account.';

        return;

      }


      saveAuth(result);

      showDashboard();

    } catch(error) {

      loginMessage.className = 'error';
      loginMessage.textContent = error.message;

    }

  }
);


/* =========================
   SHOW DASHBOARD
========================= */

function showDashboard() {

  const currentUser = user();

  if (!currentUser || currentUser.role !== 'admin') {

    loginSection.style.display = 'block';
    dashboardSection.style.display = 'none';

    return;

  }

  loginSection.style.display = 'none';
  dashboardSection.style.display = 'block';

  document.getElementById('welcome').textContent =
    'Welcome, ' + (currentUser.name || 'Administrator') + '!';

  loadDashboard();

}


/* =========================
   LOAD DASHBOARD
========================= */

async function loadDashboard() {

  try {

    const results = await Promise.all([

      api('/api/stats'),
      api('/api/sellers'),
      api('/api/users')

    ]);


    const stats = results[0];
    const sellers = results[1];
    const users = results[2];


    document.getElementById('stats').innerHTML = `

      <div class="card">
        <div class="stat">${stats.customers}</div>
        Customers
      </div>

      <div class="card">
        <div class="stat">${stats.sellers}</div>
        Sellers
      </div>

      <div class="card">
        <div class="stat">${stats.products}</div>
        Products
      </div>

    `;


    const sellerSelect =
      document.getElementById('seller');

    sellerSelect.innerHTML =
      '<option value="">Select Seller</option>' +

      sellers.sellers.map(function(s) {

        return `
          <option value="${s.id}">
            ${escapeHtml(s.name)}
            (${escapeHtml(s.email)})
          </option>
        `;

      }).join('');


    document.getElementById('users').innerHTML =

      users.users.length

        ? users.users.map(function(u) {

            return `

              <div style="padding:10px 0;border-bottom:1px solid #ddd">

                <b>${escapeHtml(u.name)}</b>

                <br>

                ${escapeHtml(u.email)}

                <br>

                <small>
                  Role: ${escapeHtml(u.role)}
                </small>

              </div>

            `;

          }).join('')

        : '<p>No users found.</p>';


    await loadProducts();


  } catch(error) {

    productMessage.className = 'error';
    productMessage.textContent = error.message;

  }

}


/* =========================
   LOAD PRODUCTS
========================= */

async function loadProducts() {

  const box =
    document.getElementById('products');

  try {

    const data = await api('/api/products');

    if (!data.products || !data.products.length) {

      box.innerHTML = '<p>No products.</p>';

      return;

    }


    box.innerHTML = data.products.map(function(p) {

      return `

        <div
          style="
            padding:12px 0;
            border-bottom:1px solid #ddd;
          "
        >

          <b>${escapeHtml(p.name)}</b>

          <p>
            ₹${escapeHtml(String(p.price))}
            · Stock ${escapeHtml(String(p.stock))}
            · Seller ${escapeHtml(
              p.seller_name || ''
            )}
          </p>

          <button
            class="danger"
            type="button"
            onclick="deleteProduct(${p.id})"
          >
            Delete
          </button>

        </div>

      `;

    }).join('');


  } catch(error) {

    box.innerHTML =
      '<p class="error">' +
      escapeHtml(error.message) +
      '</p>';

  }

}


/* =========================
   ADD PRODUCT
========================= */

document.getElementById('productForm').addEventListener(
  'submit',
  async function(e) {

    e.preventDefault();

    productMessage.className = '';
    productMessage.textContent =
      'Adding product...';


    const sellerId =
      document.getElementById('seller').value;

    const name =
      document.getElementById('productName').value.trim();

    const price =
      document.getElementById('price').value;


    if (!sellerId) {

      productMessage.className = 'error';
      productMessage.textContent =
        'Please select a seller.';

      return;

    }


    if (!name) {

      productMessage.className = 'error';
      productMessage.textContent =
        'Product name is required.';

      return;

    }


    if (price === '') {

      productMessage.className = 'error';
      productMessage.textContent =
        'Price is required.';

      return;

    }


    try {

      await api('/api/products', {

        method: 'POST',

        body: JSON.stringify({

          seller_id: Number(sellerId),

          name: name,

          description:
            document.getElementById('description').value.trim(),

          price: Number(price),

          stock:
            Number(
              document.getElementById('stock').value || 0
            ),

          image:
            document.getElementById('image').value.trim()

        })

      });


      productMessage.className = 'success';
      productMessage.textContent =
        'Product added successfully.';


      document.getElementById('productForm').reset();

      await loadDashboard();


    } catch(error) {

      productMessage.className = 'error';
      productMessage.textContent =
        error.message;

    }

  }
);


/* =========================
   DELETE PRODUCT
========================= */

async function deleteProduct(id) {

  if (!confirm('Delete this product?')) {
    return;
  }


  try {

    await api('/api/products/' + id, {
      method: 'DELETE'
    });

    await loadDashboard();


  } catch(error) {

    alert(error.message);

  }

}


/* =========================
   ESCAPE HTML
========================= */

function escapeHtml(value) {

  return String(value)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');

}


/* =========================
   START
========================= */

showDashboard();

</script></body>
</html>
