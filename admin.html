<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Dashboard</title><link rel="stylesheet" href="style.css"></head><body><nav class="nav"><div class="brand">🚚 ShipNova Admin</div><div class="navlinks"><a href="index.html">Store</a><button onclick="logout()">Logout</button></div></nav><div class="container"><h2>Admin Dashboard</h2><div id="stats" class="grid"></div><h2>Seller Approval</h2><div id="sellers"></div><h2>Product Approval</h2><div id="products"></div><h2>Orders & Tracking</h2><div id="orders"></div><h2>Coupons</h2><div class="form"><div class="row"><input id="code" placeholder="Coupon code"><select id="ctype"><option value="percent">Percent</option><option value="fixed">Fixed ₹</option></select><input id="cvalue" type="number" placeholder="Discount"><input id="minorder" type="number" placeholder="Min order"><input id="maxdiscount" type="number" placeholder="Max discount"></div><button class="btn" onclick="coupon()">Create Coupon</button><p id="cm"></p></div><div id="coupons"></div></div><script src="api-config.js"></script><script src="app.js"></script><script>
if(!getUser()||getUser().role!=="admin")location.href="admin-login.html";
async function load(){try{let s=await api("/api/admin/stats");stats.innerHTML=`<div class="card"><div>Users</div><div class="stat">${s.users}</div></div><div class="card"><div>Products</div><div class="stat">${s.products}</div></div><div class="card"><div>Orders</div><div class="stat">${s.orders}</div></div><div class="card"><div>Revenue</div><div class="stat">${money(s.revenue)}</div></div>`;let se=await api("/api/admin/sellers");sellers.innerHTML=`<div class="tablewrap"><table class="table"><tr><th>Seller</th><th>Business</th><th>GST</th><th>Approved</th><th>Action</th></tr>${se.sellers.map(x=>`<tr><td>${escapeHtml(x.name)}<br>${escapeHtml(x.email)}</td><td>${escapeHtml(x.business_name||"")}</td><td>${escapeHtml(x.gst_number||"")}</td><td>${x.approved?"Yes":"No"}</td><td><button class="btn small" onclick="approveSeller(${x.id},${!x.approved})">${x.approved?"Reject":"Approve"}</button></td></tr>`).join("")}</table></div>`;let pr=await api("/api/admin/products");products.innerHTML=`<div class="tablewrap"><table class="table"><tr><th>Product</th><th>Seller</th><th>Price</th><th>Status</th><th>Action</th></tr>${pr.products.map(x=>`<tr><td>${escapeHtml(x.name)}<br>SKU ${escapeHtml(x.sku||"-")}</td><td>${escapeHtml(x.seller_name||"")}</td><td>${money(x.price)}</td><td>${x.approval_status}</td><td><button class="btn small" onclick="approveProduct(${x.id},'${x.approval_status==="approved"?"rejected":"approved"}')">${x.approval_status==="approved"?"Reject":"Approve"}</button></td></tr>`).join("")}</table></div>`;let o=await api("/api/admin/orders");orders.innerHTML=o.orders.map(x=>`<div class="card"><b>Order #${x.id}</b> · ${money(x.total)} · ${x.status}<p>Tracking: ${escapeHtml(x.tracking_number||"")}</p><button class="btn small" onclick="status(${x.id},'confirmed')">Confirm</button> <button class="btn small" onclick="status(${x.id},'shipped')">Shipped</button> <button class="btn small success" onclick="status(${x.id},'delivered')">Delivered</button><button class="btn small danger" onclick="status(${x.id},'cancelled')">Cancel</button></div>`).join("");let c=await api("/api/admin/coupons");coupons.innerHTML=c.coupons.map(x=>`<div class="card"><b>${x.code}</b> · ${x.discount_type} ${x.discount_value} · Min ${money(x.min_order)}</div>`).join("")}catch(e){document.body.insertAdjacentHTML("beforeend","<p>"+escapeHtml(e.message)+"</p>")}}
async function approveSeller(id,a){await api("/api/admin/sellers/"+id,{method:"PUT",body:JSON.stringify({approved:a})});load()}
async function approveProduct(id,status){await api("/api/admin/products/"+id,{method:"PUT",body:JSON.stringify({approval_status:status})});load()}
async function status(id,status){let tracking=prompt("Tracking number (optional):","");await api("/api/admin/orders/"+id,{method:"PUT",body:JSON.stringify({status,tracking_number:tracking||null})});load()}
async function coupon(){try{await api("/api/admin/coupons",{method:"POST",body:JSON.stringify({code:code.value,discount_type:ctype.value,discount_value:Number(cvalue.value),min_order:Number(minorder.value||0),max_discount:Number(maxdiscount.value||0)})});cm.textContent="Coupon created";load()}catch(e){cm.textContent=e.message}}load();
</script></body></html>
