<!doctype html>
<html lang="en">
<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1">

<title>Admin Panel - ShipNovaShop</title>

<link rel="stylesheet" href="style.css">

<style>

.admin-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px;
}

.stat-card{
  text-align:center;
  padding:20px;
}

.stat-number{
  font-size:32px;
  font-weight:bold;
  margin-top:8px;
}

.admin-section{
  margin-top:25px;
}

.table-wrap{
  overflow-x:auto;
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:700px;
}

th,
td{
  padding:12px;
  border-bottom:1px solid #ddd;
  text-align:left;
}

th{
  font-weight:bold;
}

.status-select{
  padding:7px;
  border-radius:6px;
}

.danger{
  background:#dc2626;
  color:white;
  border:none;
  padding:8px 12px;
  border-radius:6px;
  cursor:pointer;
}

.message{
  margin-top:12px;
  padding:10px;
  border-radius:7px;
}

.error{
  background:#fee2e2;
  color:#991b1b;
}

.success{
  background:#dcfce7;
  color:#166534;
}

.info{
  background:#e0f2fe;
  color:#075985;
}

.loading{
  padding:20px;
  text-align:center;
}

@media(max-width:900px){

  .admin-grid{
    grid-template-columns:repeat(2,1fr);
  }

}

@media(max-width:600px){

  .admin-grid{
    grid-template-columns:1fr;
  }

}

</style>

</head>


<body>


<!-- =====================================
     NAVIGATION
===================================== -->

<nav>

  <b>ShipNova Admin</b>

  <span>

    <a href="index.html">
      Home
    </a>

    <button
      type="button"
      onclick="logout()">

      Logout

    </button>

  </span>

</nav>


<main class="container">


<!-- =====================================
     ADMIN LOGIN
===================================== -->

<section
  id="loginSection"
  style="display:none">

  <div
    class="card"
    style="max-width:500px;margin:40px auto">

    <h1>Admin Login</h1>

    <p>
      Login to ShipNovaShop administration.
    </p>


    <form id="loginForm">

      <input
        id="email"
        type="email"
        placeholder="Admin Email"
        autocomplete="username"
        required>


      <input
        id="password"
        type="password"
        placeholder="Admin Password"
        autocomplete="current-password"
        required>


      <button
        id="loginButton"
        type="submit">

        Admin Login

      </button>

    </form>


    <p
      id="loginMessage"
      class="message"
      style="display:none">
    </p>

  </div>

</section>


<!-- =====================================
     ADMIN DASHBOARD
===================================== -->

<section
  id="dashboardSection"
  style="display:none">


  <div class="card">

    <h1>Admin Dashboard</h1>

    <p id="welcome"></p>

  </div>


  <!-- =================================
       STATISTICS
  ================================== -->

  <div class="admin-grid">


    <div class="card stat-card">

      <div>
        Users
      </div>

      <div
        id="totalUsers"
        class="stat-number">

        0

      </div>

    </div>


    <div class="card stat-card">

      <div>
        Sellers
      </div>

      <div
        id="totalSellers"
        class="stat-number">

        0

      </div>

    </div>


    <div class="card stat-card">

      <div>
        Products
      </div>

      <div
        id="totalProducts"
        class="stat-number">

        0

      </div>

    </div>


    <div class="card stat-card">

      <div>
        Orders
      </div>

      <div
        id="totalOrders"
        class="stat-number">

        0

      </div>

    </div>


  </div>


  <!-- =================================
       SELLERS
  ================================== -->

  <section class="admin-section">

    <div class="card">

      <h2>All Sellers</h2>

      <div
        id="sellerList"
        class="table-wrap">

        <div class="loading">
          Loading sellers...
        </div>

      </div>

    </div>

  </section>


  <!-- =================================
       CUSTOMERS
  ================================== -->

  <section class="admin-section">

    <div class="card">

      <h2>All Customers</h2>

      <div
        id="customerList"
        class="table-wrap">

        <div class="loading">
          Loading customers...
        </div>

      </div>

    </div>

  </section>


  <!-- =================================
       PRODUCTS
  ================================== -->

  <section class="admin-section">

    <div class="card">

      <h2>All Products</h2>

      <div
        id="productList"
        class="table-wrap">

        <div class="loading">
          Loading products...
        </div>

      </div>

    </div>

  </section>


  <!-- =================================
       ORDERS
  ================================== -->

  <section class="admin-section">

    <div class="card">

      <h2>All Orders</h2>

      <div
        id="orderList"
        class="table-wrap">

        <div class="loading">
          Loading orders...
        </div>

      </div>

    </div>

  </section>


</section>


</main>


<script>


/* =====================================
   API
===================================== */

const API =
  "https://shipnovashop.onrender.com";


/* =====================================
   STORAGE
===================================== */

const TOKEN_KEY =
  "shipnova_token";

const USER_KEY =
  "shipnova_user";


/* =====================================
   ELEMENTS
===================================== */

const loginSection =
  document.getElementById(
    "loginSection"
  );

const dashboardSection =
  document.getElementById(
    "dashboardSection"
  );


/* =====================================
   API HELPER
===================================== */

async function api(
  path,
  options = {}
){

  const token =
    localStorage.getItem(
      TOKEN_KEY
    );


  const headers = {

    "Content-Type":
      "application/json",

    ...(options.headers || {})

  };


  if(token){

    headers.Authorization =
      "Bearer " + token;

  }


  const response =
    await fetch(
      API + path,
      {
        ...options,
        headers
      }
    );


  let data = {};


  try{

    data =
      await response.json();

  }catch{

    data = {};

  }


  if(!response.ok){

    if(
      response.status === 401 ||
      response.status === 403
    ){

      localStorage.removeItem(
        TOKEN_KEY
      );

      localStorage.removeItem(
        USER_KEY
      );

    }


    throw new Error(
      data.error ||
      data.message ||
      "Request failed (" +
      response.status +
      ")"
    );

  }


  return data;

}


/* =====================================
   USER
===================================== */

function getUser(){

  try{

    return JSON.parse(
      localStorage.getItem(
        USER_KEY
      ) || "null"
    );

  }catch{

    return null;

  }

}


/* =====================================
   SAVE AUTH
===================================== */

function saveAuth(data){

  if(
    !data ||
    !data.token ||
    !data.user
  ){

    throw new Error(
      "Invalid login response."
    );

  }


  localStorage.setItem(
    TOKEN_KEY,
    data.token
  );


  localStorage.setItem(
    USER_KEY,
    JSON.stringify(
      data.user
    )
  );

}


/* =====================================
   LOGOUT
===================================== */

function logout(){

  localStorage.removeItem(
    TOKEN_KEY
  );

  localStorage.removeItem(
    USER_KEY
  );


  window.location.replace(
    "index.html"
  );

}


/* =====================================
   ESCAPE HTML
===================================== */

function escapeHtml(value){

  return String(
    value ?? ""
  )

  .replace(
    /&/g,
    "&amp;"
  )

  .replace(
    /</g,
    "&lt;"
  )

  .replace(
    />/g,
    "&gt;"
  )

  .replace(
    /"/g,
    "&quot;"
  )

  .replace(
    /'/g,
    "&#039;"
  );

}


/* =====================================
   LOGIN
===================================== */

document
  .getElementById(
    "loginForm"
  )
  .addEventListener(
    "submit",
    async function(e){

      e.preventDefault();


      const email =
        document
          .getElementById(
            "email"
          )
          .value
          .trim()
          .toLowerCase();


      const password =
        document
          .getElementById(
            "password"
          )
          .value;


      const button =
        document.getElementById(
          "loginButton"
        );


      const message =
        document.getElementById(
          "loginMessage"
        );


      button.disabled =
        true;


      message.style.display =
        "block";

      message.className =
        "message info";

      message.textContent =
        "Logging in...";


      try{

        const result =
          await api(
            "/api/auth/login",
            {
              method:"POST",

              body:
                JSON.stringify({

                  email:email,

                  password:password

                })

            }
          );


        if(
          !result.user ||
          String(
            result.user.role
          ).toLowerCase()
          !== "admin"
        ){

          throw new Error(
            "This account is not an admin account."
          );

        }


        saveAuth(
          result
        );


        message.className =
          "message success";

        message.textContent =
          "Admin login successful.";


        setTimeout(
          showDashboard,
          300
        );


      }catch(error){

        console.error(
          "Admin login:",
          error
        );


        message.className =
          "message error";

        message.textContent =
          error.message ||
          "Admin login failed.";


        button.disabled =
          false;

      }

    }
  );


/* =====================================
   SHOW DASHBOARD
===================================== */

function showDashboard(){

  const user =
    getUser();

  const token =
    localStorage.getItem(
      TOKEN_KEY
    );


  if(
    !token ||
    !user ||
    String(
      user.role
    ).toLowerCase()
    !== "admin"
  ){

    loginSection.style.display =
      "block";

    dashboardSection.style.display =
      "none";

    return;

  }


  loginSection.style.display =
    "none";

  dashboardSection.style.display =
    "block";


  document
    .getElementById(
      "welcome"
    )
    .textContent =
      "Welcome, " +
      (
        user.name ||
        "Admin"
      ) +
      "!";


  loadDashboard();

}


/* =====================================
   LOAD DASHBOARD
===================================== */

async function loadDashboard(){

  await Promise.allSettled([

    loadStats(),

    loadSellers(),

    loadCustomers(),

    loadProducts(),

    loadOrders()

  ]);

}


/* =====================================
   STATISTICS
===================================== */

async function loadStats(){

  try{

    const data =
      await api(
        "/api/stats"
      );


    const stats =
      data.stats ||
      data;


    document
      .getElementById(
        "totalUsers"
      )
      .textContent =
        stats.users ??
        stats.totalUsers ??
        0;


    document
      .getElementById(
        "totalSellers"
      )
      .textContent =
        stats.sellers ??
        stats.totalSellers ??
        0;


    document
      .getElementById(
        "totalProducts"
      )
      .textContent =
        stats.products ??
        stats.totalProducts ??
        0;


    document
      .getElementById(
        "totalOrders"
      )
      .textContent =
        stats.orders ??
        stats.totalOrders ??
        0;


  }catch(error){

    console.error(
      "Stats:",
      error
    );

  }

}


/* =====================================
   SELLERS
===================================== */

async function loadSellers(){

  const box =
    document.getElementById(
      "sellerList"
    );


  try{

    const data =
      await api(
        "/api/sellers"
      );


    const sellers =
      data.sellers ||
      [];


    if(
      sellers.length === 0
    ){

      box.innerHTML =
        "<p>No sellers found.</p>";

      return;

    }


    box.innerHTML = `

      <table>

        <thead>

          <tr>

            <th>ID</th>
            <th>Name</th>
            <th>Business</th>
            <th>GSTIN</th>
            <th>Mobile</th>
            <th>Email</th>
            <th>Address</th>

          </tr>

        </thead>

        <tbody>

          ${sellers.map(
            seller => `

              <tr>

                <td>
                  ${escapeHtml(
                    seller.id
                  )}
                </td>

                <td>
                  ${escapeHtml(
                    seller.name
                  )}
                </td>

                <td>
                  ${escapeHtml(
                    seller.businessName ||
                    ""
                  )}
                </td>

                <td>
                  ${escapeHtml(
                    seller.gstNumber ||
                    ""
                  )}
                </td>

                <td>
                  ${escapeHtml(
                    seller.mobile ||
                    ""
                  )}
                </td>

                <td>
                  ${escapeHtml(
                    seller.email
                  )}
                </td>

                <td>
                  ${escapeHtml(
                    seller.address ||
                    ""
                  )}
                </td>

              </tr>

            `
          ).join("")}

        </tbody>

      </table>

    `;


  }catch(error){

    box.innerHTML =
      `
      <p class="error">
        ${escapeHtml(
          error.message
        )}
      </p>
      `;

  }

}


/* =====================================
   CUSTOMERS
===================================== */

async function loadCustomers(){

  const box =
    document.getElementById(
      "customerList"
    );


  try{

    const data =
      await api(
        "/api/users"
      );


    const users =
      data.users ||
      [];


    const customers =
      users.filter(
        user =>
          String(
            user.role
          ).toLowerCase()
          === "customer"
      );


    if(
      customers.length === 0
    ){

      box.innerHTML =
        "<p>No customers found.</p>";

      return;

    }


    box.innerHTML = `

      <table>

        <thead>

          <tr>

            <th>ID</th>
            <th>Name</th>
            <th>Email</th>
            <th>Created</th>

          </tr>

        </thead>

        <tbody>

          ${customers.map(
            user => `

              <tr>

                <td>
                  ${escapeHtml(
                    user.id
                  )}
                </td>

                <td>
                  ${escapeHtml(
                    user.name
                  )}
                </td>

                <td>
                  ${escapeHtml(
                    user.email
                  )}
                </td>

                <td>
                  ${escapeHtml(
                    user.created_at ||
                    ""
                  )}
                </td>

              </tr>

            `
          ).join("")}

        </tbody>

      </table>

    `;


  }catch(error){

    box.innerHTML =
      `
      <p class="error">
        ${escapeHtml(
          error.message
        )}
      </p>
      `;

  }

}


/* =====================================
   PRODUCTS
===================================== */

async function loadProducts(){

  const box =
    document.getElementById(
      "productList"
    );


  try{

    const data =
      await api(
        "/api/products"
      );


    const products =
      data.products ||
      [];


    if(
      products.length === 0
    ){

      box.innerHTML =
        "<p>No products found.</p>";

      return;

    }


    box.innerHTML = `

      <table>

        <thead>

          <tr>

            <th>ID</th>
            <th>Product</th>
            <th>Price</th>
            <th>Stock</th>
            <th>Seller ID</th>
            <th>Active</th>

          </tr>

        </thead>

        <tbody>

          ${products.map(
            product => `

              <tr>

                <td>
                  ${escapeHtml(
                    product.id
                  )}
                </td>

                <td>
                  ${escapeHtml(
                    product.name
                  )}
                </td>

                <td>
                  ₹${escapeHtml(
                    String(
                      product.price
                    )
                  )}
                </td>

                <td>
                  ${escapeHtml(
                    String(
                      product.stock
                    )
                  )}
                </td>

                <td>
                  ${escapeHtml(
                    String(
                      product.seller_id ||
                      ""
                    )
                  )}
                </td>

                <td>
                  ${product.active
                    ? "Yes"
                    : "No"}
                </td>

              </tr>

            `
          ).join("")}

        </tbody>

      </table>

    `;


  }catch(error){

    box.innerHTML =
      `
      <p class="error">
        ${escapeHtml(
          error.message
        )}
      </p>
      `;

  }

}


/* =====================================
   ORDERS
===================================== */

async function loadOrders(){

  const box =
    document.getElementById(
      "orderList"
    );


  try{

    const data =
      await api(
        "/api/admin/orders"
      );


    const orders =
      data.orders ||
      [];


    if(
      orders.length === 0
    ){

      box.innerHTML =
        "<p>No orders found.</p>";

      return;

    }


    box.innerHTML = `

      <table>

        <thead>

          <tr>

            <th>Order ID</th>
            <th>Customer</th>
            <th>Total</th>
            <th>Status</th>
            <th>Date</th>

          </tr>

        </thead>

        <tbody>

          ${orders.map(
            order => `

              <tr>

                <td>
                  #${escapeHtml(
                    order.id
                  )}
                </td>

                <td>
                  ${escapeHtml(
                    order.customer_name ||
                    order.customer_email ||
                    ""
                  )}
                </td>

                <td>
                  ₹${escapeHtml(
                    String(
                      order.total ||
                      order.total_amount ||
                      0
                    )
                  )}
                </td>

                <td>

                  <select
                    class="status-select"
                    onchange="updateOrderStatus(
                      ${Number(order.id)},
                      this.value
                    )">

                    ${[
                      "pending",
                      "confirmed",
                      "shipped",
                      "delivered",
                      "cancelled"
                    ].map(
                      status => `

                        <option
                          value="${status}"
                          ${
                            String(
                              order.status
                            ).toLowerCase()
                            === status
                              ? "selected"
                              : ""
                          }>

                          ${status}

                        </option>

                      `
                    ).join("")}

                  </select>

                </td>

                <td>
                  ${escapeHtml(
                    order.created_at ||
                    ""
                  )}
                </td>

              </tr>

            `
          ).join("")}

        </tbody>

      </table>

    `;


  }catch(error){

    box.innerHTML =
      `
      <p class="error">
        ${escapeHtml(
          error.message
        )}
      </p>
      `;

  }

}


/* =====================================
   UPDATE ORDER STATUS
===================================== */

async function updateOrderStatus(
  id,
  status
){

  try{

    await api(
      "/api/admin/orders/" +
      encodeURIComponent(id) +
      "/status",
      {
        method:"PUT",

        body:
          JSON.stringify({
            status:status
          })

      }
    );


    alert(
      "Order status updated successfully."
    );


    await loadOrders();


  }catch(error){

    alert(
      error.message ||
      "Could not update order status."
    );


    await loadOrders();

  }

}


/* =====================================
   START
===================================== */

showDashboard();


</script>

</body>
</html>
