<!doctype html><html><head><meta charset="utf-8"><title>Admin</title><link rel="stylesheet" href="style.css"></head><body><nav><b>Admin Dashboard</b><span><a href="product.html">Store</a><button onclick="logout()">Logout</button></span></nav><main class="container"><div id="stats" class="stats"></div><div class="card"><h2>Add Product</h2><form id="form"><select id="seller"></select><input id="name" placeholder="Product name" required><textarea id="description" placeholder="Description"></textarea><input id="price" type="number" step="0.01" placeholder="Price" required><input id="stock" type="number" placeholder="Stock" required><input id="image" placeholder="Image URL"><button>Add Product</button></form><p id="msg"></p></div><div class="card"><h2>All Products</h2><div id="list"></div></div></main><script src="api-config.js"></script><script src="app.js"></script><script>if(!user()||user().role!=='admin'){location.href='index.html'}async function load(){const [s,p,ss]=await Promise.all([api('/api/stats'),api('/api/products'),api('/api/sellers')]);stats.innerHTML=`<div class="card"><div class="stat">${s.customers}</div>Customers</div><div class="card"><div class="stat">${s.sellers}</div>Sellers</div><div class="card"><div class="stat">${s.products}</div>Products</div>`;seller.innerHTML=ss.sellers.map(x=>`<option value="${x.id}">${x.name} (${x.email})</option>`).join('');list.innerHTML=p.products.map(x=>`<div class="card"><div class="row"><div style="flex:1"><b>${x.name}</b><p>₹${x.price} · ${x.seller_name} · Stock ${x.stock}</p></div><button class="danger" onclick="del(${x.id})">Delete</button></div></div>`).join('')||'No products'}async function del(id){if(confirm('Delete?')){await api('/api/products/'+id,{method:'DELETE'});load()}}form.onsubmit=async e=>{e.preventDefault();try{await api('/api/products',{method:'POST',body:JSON.stringify({seller_id:seller.value,name:name.value,description:description.value,price:price.value,stock:stock.value,image:image.value})});msg.className='success';msg.textContent='Product added successfully';form.reset();load()}catch(x){msg.className='error';msg.textContent=x.message}};load()</script></body></html>
